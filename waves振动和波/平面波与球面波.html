<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波的传播：平面波与球面波</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc; /* slate-50 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #controls {
            background: rgba(30, 41, 59, 0.9); /* slate-800 with opacity */
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #334155;
            z-index: 10;
        }

        canvas {
            flex-grow: 1;
            display: block;
            width: 100%;
            height: 100%;
        }

        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #475569;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            transition: background .15s ease-in-out;
        }

        .slider::-webkit-slider-thumb:hover {
            background: #7dd3fc;
        }
        
        /* Custom Checkbox */
        .custom-checkbox {
            appearance: none;
            background-color: #1e293b;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.15em;
            height: 1.15em;
            border: 2px solid #38bdf8;
            border-radius: 0.25em;
            display: grid;
            place-content: center;
            cursor: pointer;
        }

        .custom-checkbox::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #38bdf8;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        .radio-btn input[type="radio"] {
            display: none;
        }

        .radio-btn label {
            display: inline-block;
            padding: 8px 16px;
            background-color: #1e293b;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            cursor: pointer;
            transition: all 0.2s;
        }

        .radio-btn:first-child label {
            border-radius: 6px 0 0 6px;
        }

        .radio-btn:last-child label {
            border-radius: 0 6px 6px 0;
            border-left: none;
        }

        .radio-btn input[type="radio"]:checked + label {
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 控制面板 -->
    <div id="controls" class="p-4 md:p-6 shadow-lg flex flex-col md:flex-row gap-6 md:items-center justify-between">
        <div>
            <h1 class="text-xl font-bold text-white mb-1">波的传播特性演示</h1>
            <p class="text-xs text-slate-400">观察波阵面(等相面)与波线(传播方向)的几何关系</p>
        </div>

        <div class="flex flex-wrap gap-6 items-center">
            <!-- 波类型选择 -->
            <div class="flex">
                <div class="radio-btn">
                    <input type="radio" id="type-plane" name="wavetype" value="plane" checked>
                    <label for="type-plane">平面波 (Plane Wave)</label>
                </div>
                <div class="radio-btn">
                    <input type="radio" id="type-spherical" name="wavetype" value="spherical">
                    <label for="type-spherical">球面波 (Spherical Wave)</label>
                </div>
            </div>

            <!-- 显示元素开关 -->
            <div class="flex gap-4">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="show-wavefronts" class="custom-checkbox" checked>
                    <span class="text-sm font-medium">显示波阵面 (青色)</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="show-wavelines" class="custom-checkbox" checked>
                    <span class="text-sm font-medium">显示波线 (橙色)</span>
                </label>
            </div>

            <!-- 参数调节 -->
            <div class="flex gap-4 w-full md:w-auto">
                <div class="flex flex-col w-32">
                    <label for="wavelength" class="text-xs mb-1 text-slate-300">波长 (Wavelength)</label>
                    <input type="range" id="wavelength" class="slider" min="30" max="200" value="80">
                </div>
                <div class="flex flex-col w-32">
                    <label for="speed" class="text-xs mb-1 text-slate-300">波速 (Speed)</label>
                    <input type="range" id="speed" class="slider" min="10" max="200" value="60">
                </div>
            </div>
        </div>
    </div>

    <!-- 物理说明 -->
    <div id="description" class="absolute bottom-6 left-6 right-6 md:right-auto md:w-96 bg-slate-800/80 backdrop-blur border border-slate-600 p-4 rounded-lg z-10 pointer-events-none">
        <h3 id="desc-title" class="text-lg font-bold text-sky-400 mb-2">平面波</h3>
        <p id="desc-text" class="text-sm text-slate-200 leading-relaxed">
            在各向同性的均匀介质中，平面波的<strong>波阵面</strong>（相位相等的点组成的面）是相互平行的平面（二维中表现为直线）。<strong>波线</strong>（表示波的传播方向）是与波阵面垂直的平行直线。通常表示距离波源极远处的波。
        </p>
    </div>

    <!-- 动画画布 -->
    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // 状态管理
        const state = {
            type: 'plane', // 'plane' 或 'spherical'
            showWavefronts: true,
            showWavelines: true,
            wavelength: 80,
            speed: 60,
            distanceTravelled: 0 // 记录波传播的总距离
        };

        // DOM 元素引用
        const typePlaneBtn = document.getElementById('type-plane');
        const typeSphericalBtn = document.getElementById('type-spherical');
        const showWavefrontsCb = document.getElementById('show-wavefronts');
        const showWavelinesCb = document.getElementById('show-wavelines');
        const wavelengthSlider = document.getElementById('wavelength');
        const speedSlider = document.getElementById('speed');
        
        const descTitle = document.getElementById('desc-title');
        const descText = document.getElementById('desc-text');

        // 事件监听
        typePlaneBtn.addEventListener('change', (e) => { 
            if(e.target.checked) {
                state.type = 'plane';
                updateDescription();
            }
        });
        typeSphericalBtn.addEventListener('change', (e) => { 
            if(e.target.checked) {
                state.type = 'spherical'; 
                updateDescription();
            }
        });
        
        showWavefrontsCb.addEventListener('change', (e) => state.showWavefronts = e.target.checked);
        showWavelinesCb.addEventListener('change', (e) => state.showWavelines = e.target.checked);
        wavelengthSlider.addEventListener('input', (e) => state.wavelength = parseInt(e.target.value));
        speedSlider.addEventListener('input', (e) => state.speed = parseInt(e.target.value));

        function updateDescription() {
            if (state.type === 'plane') {
                descTitle.innerText = "平面波 (Plane Wave)";
                descText.innerHTML = "在各向同性的均匀介质中，平面波的<strong>波阵面</strong>（相位相等的点组成的面）是相互平行的平面（二维中表现为直线）。<strong>波线</strong>（表示波的传播方向）是与波阵面垂直的平行直线。通常表示距离波源极远处的波。";
            } else {
                descTitle.innerText = "球面波 (Spherical Wave)";
                descText.innerHTML = "由点波源发出的波，其<strong>波阵面</strong>是同心球面（二维中表现为同心圆）。<strong>波线</strong>是沿半径向外辐射的直线，始终与波阵面垂直。随着波的扩散，单位面积上的能量会逐渐减弱。";
            }
        }

        // 处理画布缩放
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - document.getElementById('controls').offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 绘制带箭头的线段辅助函数
        function drawArrowLine(ctx, x1, y1, x2, y2, color = '#f97316', dash = []) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.setLineDash(dash);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.setLineDash([]); // 恢复实线画箭头

            // 计算角度
            const angle = Math.atan2(y2 - y1, x2 - x1);
            const headlen = 12; // 箭头长度
            
            // 箭头绘制 (在线段的中间或者特定位置)
            // 这里我们在线段长度的 60% 处绘制箭头，或者如果在传播，动态位置
            
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
            ctx.fill();
        }

        // 绘制波线上的动态箭头
        function drawDynamicArrow(ctx, x, y, angle, color = '#f97316') {
            const headlen = 12;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - headlen * Math.cos(angle - Math.PI / 6), y - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x - headlen * Math.cos(angle + Math.PI / 6), y - headlen * Math.sin(angle + Math.PI / 6));
            ctx.fill();
        }

        let lastTime = performance.now();

        // 动画主循环
        function animate(currentTime) {
            const deltaTime = (currentTime - lastTime) / 1000; // 秒
            lastTime = currentTime;

            // 更新波传播距离
            state.distanceTravelled += state.speed * deltaTime;

            // 清理画布
            ctx.fillStyle = '#0f172a'; // 深色背景
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width;
            const h = canvas.height;

            if (state.type === 'plane') {
                drawPlaneWave(w, h);
            } else {
                drawSphericalWave(w, h);
            }

            requestAnimationFrame(animate);
        }

        function drawPlaneWave(w, h) {
            const phaseOffset = state.distanceTravelled % state.wavelength;
            
            // 1. 绘制波阵面 (Wavefronts)
            if (state.showWavefronts) {
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.8)'; // cyan-400
                ctx.lineWidth = 3;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#38bdf8';
                
                // 从左到右绘制垂直线
                for (let x = phaseOffset - state.wavelength; x < w + state.wavelength; x += state.wavelength) {
                    if (x < 0) continue;
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, h);
                    ctx.stroke();
                }
                ctx.shadowBlur = 0; // 重置
            }

            // 2. 绘制波线 (Wavelines / Rays)
            if (state.showWavelines) {
                const numLines = 7;
                const spacing = h / numLines;
                
                ctx.strokeStyle = 'rgba(251, 146, 60, 0.6)'; // orange-400
                ctx.lineWidth = 2;
                ctx.setLineDash([10, 10]);

                for (let i = 0; i <= numLines; i++) {
                    const y = i * spacing;
                    
                    // 画虚线
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(w, y);
                    ctx.stroke();

                    // 绘制移动的箭头表示能量流动
                    ctx.setLineDash([]);
                    const arrowPhase = (state.distanceTravelled * 1.5) % 200;
                    for(let ax = arrowPhase; ax < w; ax += 200) {
                        drawDynamicArrow(ctx, ax, y, 0, '#fb923c');
                    }
                    ctx.setLineDash([10, 10]);
                }
                ctx.setLineDash([]);
            }
        }

        function drawSphericalWave(w, h) {
            const cx = w / 2;
            const cy = h / 2;
            const maxRadius = Math.hypot(cx, cy); // 屏幕角落的最远距离
            const phaseOffset = state.distanceTravelled % state.wavelength;

            // 绘制波源发光点
            ctx.beginPath();
            ctx.arc(cx, cy, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ffffff';
            ctx.fill();
            ctx.shadowBlur = 0;

            // 1. 绘制波阵面 (Wavefronts)
            if (state.showWavefronts) {
                ctx.lineWidth = 3;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#38bdf8';

                for (let r = phaseOffset; r < maxRadius; r += state.wavelength) {
                    if (r <= 0) continue;
                    
                    // 模拟能量衰减（越远越暗），以提高物理真实感
                    const opacity = Math.max(0.1, 1 - (r / maxRadius) * 0.8);
                    ctx.strokeStyle = `rgba(56, 189, 248, ${opacity})`;

                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
            }

            // 2. 绘制波线 (Wavelines / Rays)
            if (state.showWavelines) {
                const numRays = 16;
                const angleStep = (Math.PI * 2) / numRays;
                
                ctx.strokeStyle = 'rgba(251, 146, 60, 0.5)';
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 8]);

                for (let i = 0; i < numRays; i++) {
                    const angle = i * angleStep;
                    
                    // 射线终点
                    const endX = cx + Math.cos(angle) * maxRadius;
                    const endY = cy + Math.sin(angle) * maxRadius;

                    ctx.beginPath();
                    // 从稍外侧开始画，避开波源圆点
                    ctx.moveTo(cx + Math.cos(angle)*10, cy + Math.sin(angle)*10);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();

                    // 绘制向外移动的箭头
                    ctx.setLineDash([]);
                    const arrowPhase = (state.distanceTravelled * 1.5) % 150;
                    for(let ar = arrowPhase + 30; ar < maxRadius; ar += 150) {
                        const arrowX = cx + Math.cos(angle) * ar;
                        const arrowY = cy + Math.sin(angle) * ar;
                        // 随着距离变远，箭头稍微变淡
                        const opacity = Math.max(0.3, 1 - (ar / maxRadius) * 0.6);
                        drawDynamicArrow(ctx, arrowX, arrowY, angle, `rgba(251, 146, 60, ${opacity})`);
                    }
                    ctx.setLineDash([8, 8]);
                }
                ctx.setLineDash([]);
            }
        }

        // 启动动画
        requestAnimationFrame(animate);

    </script>
</body>
</html>
