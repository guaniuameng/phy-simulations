<body class="text-cyan-50 font-sans selection:bg-cyan-500/30">

    <!-- UI 控制面板 -->
    <div id="controlPanel" class="absolute top-4 left-4 z-10 w-80 hud-panel rounded-xl p-6 transition-all duration-500">
        <h1 class="text-2xl font-bold mb-2 tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-400 to-purple-500" style="text-shadow: 0 0 20px rgba(0,243,255,0.3);">
            三体问题模拟器
        </h1>
        <p class="text-xs text-cyan-200/60 mb-5 leading-relaxed tracking-wider">
            三体问题（Three-body problem）是天体力学中的基本力学模型。系统表现出高度的混沌行为，即使是经典的“8字形”稳定解，在长时间运算下也会演变成混乱无序的轨迹。
        </p>
        
        <div class="space-y-3">
            <!-- 新增：播放与重置控制 -->
            <div class="flex space-x-3 mb-2">
                <button id="playBtn" onclick="togglePlay()" class="flex-1 py-2.5 bg-cyan-500/10 border border-cyan-500/50 hover:bg-cyan-500/20 text-cyan-400 rounded-lg transition-all shadow-[0_0_10px_rgba(0,243,255,0.2)] hover:shadow-[0_0_20px_rgba(0,243,255,0.5)] font-medium text-sm flex justify-center items-center tracking-widest"><svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg><span>运行</span></button>
                <button onclick="resetSimulation()" class="flex-1 py-2.5 bg-slate-500/10 border border-slate-500/50 hover:bg-slate-500/20 text-slate-300 rounded-lg transition-all shadow-[0_0_10px_rgba(148,163,184,0.2)] hover:shadow-[0_0_20px_rgba(148,163,184,0.5)] font-medium text-sm flex justify-center items-center tracking-widest">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    重置
                </button>
            </div>

            <button onclick="initFigure8(true)" class="w-full py-2.5 bg-blue-500/10 border border-blue-500/50 hover:bg-blue-500/20 text-blue-400 rounded-lg transition-all shadow-[0_0_10px_rgba(59,130,246,0.2)] hover:shadow-[0_0_20px_rgba(59,130,246,0.5)] font-medium text-sm tracking-wider">

            <button onclick="initChaos(true)" class="w-full py-2.5 bg-fuchsia-500/10 border border-fuchsia-500/50 hover:bg-fuchsia-500/20 text-fuchsia-400 rounded-lg transition-all shadow-[0_0_10px_rgba(217,70,239,0.2)] hover:shadow-[0_0_20px_rgba(217,70,239,0.5)] font-medium text-sm tracking-wider">

                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>

    <!-- 录制状态指示器 (仅在录制时显示) -->
    <div id="recordingIndicator" class="absolute top-6 right-6 z-10 hud-panel rounded-full px-5 py-2 text-rose-400 font-bold flex items-center shadow-[0_0_20px_rgba(244,63,94,0.4)] border-rose-500/50 opacity-0 pointer-events-none transition-all duration-500 tracking-wider text-sm">
        <svg class="w-4 h-4 mr-2 animate-pulse" fill="currentColor" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8"></circle></svg>
        正在录制... (<span id="recordCountdownText">0</span>s)
    </div>

    <!-- 渲染画布 -->
    <canvas id="simCanvas" width="1040" height="626"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // --- 物理引擎核心参数 (改为动态变量以适应不同模式) ---
        const G = 1; // 万有引力常数
        let physicsSubsteps = 100; // 每帧的物理步数 
        let physicsDT = 0.0005; // 物理时间步长
        let currentSoftening = 0; // 当前的引力软化因子

        let VISUAL_SCALE = 200; // 将物理坐标映射到屏幕的缩放比例
        const TRAIL_LENGTH = 40; // 拖尾长度 (再次大幅缩短，原为100)

        let bodies = [];
        let stars = [];
        let isTrackingCM = true;

        // 新增状态控制变量
        let isRunning = false;
        let initialBodiesState = []; // 用于保存初始状态

        // 监听UI变化
        document.getElementById('trackCamera').addEventListener('change', (e) => {
            isTrackingCM = e.target.checked;
        });

        // 窗口自适应
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            // 每次调整窗口大小时，动态生成星空背景
            generateStars();
        }
        window.addEventListener('resize', resize);

        // 生成背景点点繁星，增加闪烁属性
        function generateStars() {
            stars = [];
            for (let i = 0; i < 250; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    alpha: Math.random() * 0.8 + 0.1,
                    blinkSpeed: Math.random() * 0.002 + 0.001 // 控制闪烁速度
                });
            }
        }

        // --- 天体类 (Body) ---
        class Body {
            constructor(mass, x, y, vx, vy, color) {
                this.mass = mass;
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                // 根据质量设定半径，确保视觉上不过于庞大
                this.radius = Math.max(4, Math.pow(mass, 1/3) * 6);
                this.trail = [];
            }

            // 计算引力并更新速度 (使用辛欧拉法的第一步)
            updateVelocity(allBodies, dt) {
                let ax = 0;
                let ay = 0;

                for (let other of allBodies) {
                    if (other === this) continue;

                    let dx = other.x - this.x;
                    let dy = other.y - this.y;
                    let distSq = dx * dx + dy * dy;

                    // 引入动态的软化因子。
                    // 精确解(如8字形)需要为0以保证数学完美，随机混沌则需要大于0防止奇点甩飞。
                    distSq += currentSoftening; 

                    let dist = Math.sqrt(distSq);
                    let force = (G * other.mass) / distSq;

                    ax += force * (dx / dist);
                    ay += force * (dy / dist);
                }

                this.vx += ax * dt;
                this.vy += ay * dt;
            }

            // 根据新速度更新位置 (使用辛欧拉法的第二步)
            updatePosition(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
            }

            // 记录轨迹
            recordTrail() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > TRAIL_LENGTH) {
                    this.trail.shift();
                }
            }

            // 绘制天体本身 (科幻材质渲染)
            draw(ctx) {
                // 使用 lighter 实现发光叠加效果
                ctx.globalCompositeOperation = 'lighter';

                let screenX = this.x * VISUAL_SCALE;
                let screenY = this.y * VISUAL_SCALE;

                // 1. 绘制外部能量光晕 (Glow Aura)
                ctx.beginPath();
                let auraRadius = this.radius * 3.5;
                ctx.arc(screenX, screenY, auraRadius, 0, Math.PI * 2);
                let auraGrad = ctx.createRadialGradient(screenX, screenY, this.radius * 0.5, screenX, screenY, auraRadius);
                auraGrad.addColorStop(0, this.color + '66'); // 内部半透明
                auraGrad.addColorStop(1, this.color + '00'); // 边缘全透明
                ctx.fillStyle = auraGrad;
                ctx.fill();

                // 2. 绘制星体核心 (Bright Core)
                ctx.beginPath();
                ctx.arc(screenX, screenY, this.radius, 0, Math.PI * 2);
                let coreGrad = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, this.radius);
                coreGrad.addColorStop(0, '#ffffff'); // 核心高温纯白
                coreGrad.addColorStop(0.3, '#ffffff'); 
                coreGrad.addColorStop(1, this.color); // 边缘过渡到主题色
                ctx.fillStyle = coreGrad;
                
                // 核心阴影增加科技感泛光
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                
                // 重置
                ctx.shadowBlur = 0;
                ctx.globalCompositeOperation = 'source-over';
            }

            // 绘制运动拖尾 (高能尾迹效果)
            drawTrail(ctx) {
                if (this.trail.length < 2) return;

                ctx.globalCompositeOperation = 'lighter';
                // 适当降低阴影模糊范围，显著提升性能
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color;
                
                // 性能优化：将不变的 Canvas 状态设置移出循环
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.strokeStyle = this.color;

                // 为了性能和渐变效果，分段绘制线条并改变透明度
                let len = this.trail.length;
                for (let i = 0; i < len - 1; i++) {
                    let alpha = Math.pow(i / len, 2) * 0.9;
                    
                    // 性能优化：透明度过低时直接跳过绘制，肉眼无法察觉且省去了大量无用渲染
                    if (alpha < 0.02) continue;

                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.moveTo(this.trail[i].x * VISUAL_SCALE, this.trail[i].y * VISUAL_SCALE);
                    ctx.lineTo(this.trail[i+1].x * VISUAL_SCALE, this.trail[i+1].y * VISUAL_SCALE);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1.0; // 重置透明度
                ctx.shadowBlur = 0;
                ctx.globalCompositeOperation = 'source-over';
            }
        }

        // --- 场景初始化与状态控制 ---

        // 保存当前星体状态为初始状态
        function saveInitialState() {
            initialBodiesState = bodies.map(b => ({
                mass: b.mass,
                x: b.x, y: b.y,
                vx: b.vx, vy: b.vy,
                color: b.color,
                radius: b.radius
            }));
        }

        // 重置为初始状态
        window.resetSimulation = function() {
            if (initialBodiesState.length === 0) return;
            bodies = initialBodiesState.map(s => {
                let b = new Body(s.mass, s.x, s.y, s.vx, s.vy, s.color);
                b.radius = s.radius;
                return b;
            });
            clearTrails();
            isRunning = false; // 暂停播放
            updatePlayBtnUI();
        }

        // 切换播放/暂停
        window.togglePlay = function() {
            isRunning = !isRunning;
            updatePlayBtnUI();
        }

        // 更新播放按钮UI (适配科幻风格)
        function updatePlayBtnUI() {
            const btn = document.getElementById('playBtn');
            if (!btn) return;
            if (isRunning) {
                btn.className = "flex-1 py-2.5 bg-amber-500/10 border border-amber-500/50 hover:bg-amber-500/20 text-amber-400 rounded-lg transition-all shadow-[0_0_10px_rgba(245,158,11,0.2)] hover:shadow-[0_0_20px_rgba(245,158,11,0.5)] font-medium text-sm flex justify-center items-center tracking-widest";
                btn.innerHTML = `<svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg><span>暂停</span>`;
            } else {
                btn.className = "flex-1 py-2.5 bg-cyan-500/10 border border-cyan-500/50 hover:bg-cyan-500/20 text-cyan-400 rounded-lg transition-all shadow-[0_0_10px_rgba(0,243,255,0.2)] hover:shadow-[0_0_20px_rgba(0,243,255,0.5)] font-medium text-sm flex justify-center items-center tracking-widest";
                btn.innerHTML = `<svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg><span>运行</span>`;
            }
        }

        // 清除所有轨迹
        window.clearTrails = function() {
            for (let b of bodies) b.trail = [];
        }

        // 初始化经典的“8字形”稳定轨道
        window.initFigure8 = function(autoplay = true) {
            bodies = [];
            // 根据屏幕大小调整视觉缩放
            VISUAL_SCALE = Math.min(width, height) / 3;

            // 【关键修改】为精确解关闭软化因子，并大幅提升积分精度
            currentSoftening = 0; 
            physicsSubsteps = 500;  // 精度提升5倍
            physicsDT = 0.0001;     // 时间步长缩小5倍

            const m = 1;
            // 8字形轨道的精确初始参数
            const x1 = 0.97000436, y1 = -0.24308753;
            const vx3 = -0.93240737, vy3 = -0.86473146;
            const vx1 = -vx3 / 2, vy1 = -vy3 / 2;

            // 使用对比更加强烈的科幻配色，彻底避免颜色混淆
            // 玫瑰红粉
            bodies.push(new Body(m, x1, y1, vx1, vy1, '#ff0055'));
            // 薄荷青绿
            bodies.push(new Body(m, -x1, -y1, vx1, vy1, '#00ffaa'));
            // 琥珀明黄
            bodies.push(new Body(m, 0, 0, vx3, vy3, '#ffaa00'));
            
            saveInitialState();
            isRunning = autoplay;
            updatePlayBtnUI();
        }

        // 初始化随机混沌系统
        window.initChaos = function(autoplay = true) {
            bodies = [];
            // 初始视觉比例设为稍微远一点
            VISUAL_SCALE = Math.min(width, height) / 6;

            // 【关键修改】稍微提高引力软化因子(从0.05提升至0.15)，抑制过于暴力的弹弓抛射效应
            currentSoftening = 0.15; 
            physicsSubsteps = 100;
            physicsDT = 0.0005;

            // 科幻配色组，确保三个星球颜色差异显著
            const colors = ['#ff0055', '#00ffaa', '#ffaa00'];

            // 随机生成三个星体
            for (let i = 0; i < 3; i++) {
                // 适当增加星体质量，使其互相之间的引力势阱更深、束缚更强
                let m = 1.2 + Math.random() * 0.6; 
                // 初始位置聚拢一点，防止一开始跨度太大
                let x = (Math.random() * 2 - 1) * 1.0;
                let y = (Math.random() * 2 - 1) * 1.0;
                // 显著降低初始速度
                let vx = (Math.random() * 2 - 1) * 0.15;
                let vy = (Math.random() * 2 - 1) * 0.15;
                bodies.push(new Body(m, x, y, vx, vy, colors[i]));
            }

            // 【关键步骤】抵消系统的总动量，防止三个星体作为整体飞出屏幕外
            let px = 0, py = 0, totalM = 0;
            for (let b of bodies) {
                px += b.mass * b.vx;
                py += b.mass * b.vy;
                totalM += b.mass;
            }
            for (let b of bodies) {
                b.vx -= px / totalM;
                b.vy -= py / totalM;
            }
            
            saveInitialState();
            isRunning = autoplay;
            updatePlayBtnUI();
        }

        // --- 核心动画循环 ---
        function animate() {
            // 清空画布并绘制深邃科幻背景
            ctx.fillStyle = '#02040a';
            ctx.fillRect(0, 0, width, height);

            // 1. 绘制全息动态雷达坐标网格 (HUD Grid)
            ctx.save();
            // 计算质量中心用于网格偏移，制造视差穿梭感
            let cmx = 0, cmy = 0;
            if (isTrackingCM) {
                let totalMass = 0;
                for (let b of bodies) {
                    cmx += b.x * b.mass;
                    cmy += b.y * b.mass;
                    totalMass += b.mass;
                }
                cmx /= totalMass;
                cmy /= totalMass;
            }

            let offsetX = (width / 2 - cmx * VISUAL_SCALE) % 60;
            let offsetY = (height / 2 - cmy * VISUAL_SCALE) % 60;
            
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.04)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let x = offsetX - 60; x < width; x += 60) {
                ctx.moveTo(x, 0); ctx.lineTo(x, height);
            }
            for(let y = offsetY - 60; y < height; y += 60) {
                ctx.moveTo(0, y); ctx.lineTo(width, y);
            }
            ctx.stroke();
            ctx.restore();

            // 2. 绘制静态星空背景带轻微呼吸闪烁
            let now = Date.now();
            for (let star of stars) {
                let currentAlpha = star.alpha + Math.sin(now * star.blinkSpeed) * 0.3;
                currentAlpha = Math.max(0, Math.min(1, currentAlpha));
                ctx.fillStyle = `rgba(200, 240, 255, ${currentAlpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }

            // 物理子步进 (Sub-stepping) - 提升数值积分的稳定性
            // 仅在运行状态下更新物理位置
            if (isRunning) {
                for (let i = 0; i < physicsSubsteps; i++) {
                    // 第一步：根据当前位置计算所有引力，更新速度
                    for (let b of bodies) b.updateVelocity(bodies, physicsDT);
                    // 第二步：使用新的速度更新位置
                    for (let b of bodies) b.updatePosition(physicsDT);
                }

                // 每帧记录一次轨迹 (不需要在每个物理子步中记录)
                for (let b of bodies) b.recordTrail();
            }

            // 计算质量中心 (Center of Mass, CM) 并准备渲染中心
            cmx = 0; cmy = 0;
            let totalMass = 0;
            for (let b of bodies) {
                cmx += b.x * b.mass;
                cmy += b.y * b.mass;
                totalMass += b.mass;
            }
            cmx /= totalMass;
            cmy /= totalMass;

            let renderCmx = isTrackingCM ? cmx : 0;
            let renderCmy = isTrackingCM ? cmy : 0;

            // 【全新特性】智能全息镜头自适应缩放 (Auto-Zoom)
            // 计算距离渲染中心最远的星体距离
            let maxDistSq = 0;
            for (let b of bodies) {
                let dx = b.x - renderCmx;
                let dy = b.y - renderCmy;
                let distSq = dx * dx + dy * dy;
                if (distSq > maxDistSq) maxDistSq = distSq;
            }
            let maxDist = Math.sqrt(maxDistSq);

            // 目标缩放比例：让最远的星体占据屏幕半径的 65% 左右，留出舒适的边缘空间
            let screenRadius = Math.min(width, height) / 2;
            let targetScale = (screenRadius * 0.65) / (maxDist + 0.001);

            // 限制最大放大倍数，防止星体靠得太近时画面过度放大
            let maxScale = Math.min(width, height) / 2.5;
            if (targetScale > maxScale) targetScale = maxScale;

            // 限制最小缩小倍数，防止星体飞得极远时缩成看不见的像素
            let minScale = Math.min(width, height) / 40;
            if (targetScale < minScale) targetScale = minScale;

            // 使用 Lerp (线性插值) 平滑过渡镜头缩放，营造摄影机拉近/拉远的电影感
            if (isRunning) {
                VISUAL_SCALE += (targetScale - VISUAL_SCALE) * 0.015;
            } else {
                VISUAL_SCALE += (targetScale - VISUAL_SCALE) * 0.1; // 暂停时镜头快速就位
            }

            // 将画布原点平移，使得镜头聚焦在系统的质量中心或者屏幕正中心
            ctx.save();
            ctx.translate(width / 2 - renderCmx * VISUAL_SCALE, height / 2 - renderCmy * VISUAL_SCALE);

            // 渲染：先画拖尾，再画星球本体，使得星球叠加在拖尾上方
            for (let b of bodies) b.drawTrail(ctx);
            for (let b of bodies) b.draw(ctx);

            ctx.restore();

            // 循环调用
            requestAnimationFrame(animate);
        }

        // --- 通用高级文件保存功能 (支持弹出另存为对话框) ---
        async function saveFileAs(blob, defaultName, description, acceptObj) {
            // 检查浏览器是否支持现代的 File System Access API
            if (window.showSaveFilePicker) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: defaultName,
                        types: [{
                            description: description,
                            accept: acceptObj,
                        }],
                    });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    return; // 成功保存
                } catch (err) {
                    // 如果用户点击了取消，则直接返回
                    if (err.name === 'AbortError') return;
                    console.warn('高级保存失败，回退到传统下载:', err);
                }
            }
            
            // 如果不支持或发生错误(如在安全沙盒环境中)，回退到传统的自动下载方式
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = defaultName;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 100);
        }

        // --- 录制视频功能 ---
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        // --- 预加载 GIF Worker 以避开 CDN 的跨域 Worker 限制 ---
        let gifWorkerBlobUrl = null;
        fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js')
            .then(response => response.text())
            .then(text => {
                const blob = new Blob([text], { type: 'application/javascript' });
                gifWorkerBlobUrl = URL.createObjectURL(blob);
            })
            .catch(err => console.error("GIF Worker 加载失败:", err));

        window.startRecording = function() {
            if (isRecording) return;
            
            // 修改：录制开始时强制保持暂停状态，2秒后再开始运动
            isRunning = false;
            updatePlayBtnUI();
            
            setTimeout(() => {
                // 如果2秒后仍在录制状态中，则自动开始播放
                if (isRecording) {
                    isRunning = true;
                    updatePlayBtnUI();
                }
            }, 2000);
            
            const durationInput = document.getElementById('recordDuration');
            let duration = parseInt(durationInput.value);
            if (isNaN(duration) || duration <= 0) duration = 5; 
            
            // 【新增】将录制的总时长设定为：设定的运动时长 + 2秒的初始静止展示时长
            let totalDuration = duration + 2;
            
            // 捕获 Canvas 视频流 (60帧/秒)
            const stream = canvas.captureStream(60); 
            
            // 尝试优先使用 mp4 编码，如果浏览器不支持则回退到 webm
            let mimeType = 'video/mp4';
            if (!MediaRecorder.isTypeSupported(mimeType)) {
                mimeType = 'video/webm; codecs=vp9';
            }
            if (!MediaRecorder.isTypeSupported(mimeType)) {
                mimeType = 'video/webm'; // 最后的兼容回退
            }
            
            mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
            recordedChunks = [];
            
            mediaRecorder.ondataavailable = function(e) {
                if (e.data.size > 0) {
                    recordedChunks.push(e.data);
                }
            };
            
            mediaRecorder.onstop = async function() {
                const blob = new Blob(recordedChunks, { type: mimeType });
                
                // 恢复按钮和面板状态 (在弹窗保存前先恢复UI)
                isRecording = false;
                
                const panel = document.getElementById('controlPanel');
                panel.classList.remove('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    panel.classList.add('duration-500');
                }, 50);
                
                document.getElementById('recordingIndicator').classList.add('opacity-0', 'pointer-events-none');
                
                // 恢复录制按钮的霓虹科技感样式
                const btn = document.getElementById('recordBtn');
                btn.innerHTML = '<svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clip-rule="evenodd"></path></svg>录制视频 (MP4)';
                btn.classList.remove('bg-rose-900/50', 'animate-pulse', 'border-rose-400');
                btn.classList.add('bg-rose-500/10', 'hover:bg-rose-500/20');

                // 调用保存功能
                const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
                let acceptType = {};
                acceptType[mimeType] = [`.${ext}`];
                await saveFileAs(blob, `three-body-simulation.${ext}`, '视频文件', acceptType);
            };
            
            mediaRecorder.start();
            isRecording = true;
            
            // 隐藏控制面板，录制按钮转为活跃脉冲状态
            const btn = document.getElementById('recordBtn');
            btn.classList.remove('bg-rose-500/10', 'hover:bg-rose-500/20');
            btn.classList.add('bg-rose-900/50', 'animate-pulse', 'border-rose-400');

            const panel = document.getElementById('controlPanel');
            panel.classList.remove('duration-500');
            panel.classList.add('opacity-0', 'pointer-events-none');
            
            document.getElementById('recordingIndicator').classList.remove('opacity-0', 'pointer-events-none');
            
            let timeLeft = totalDuration; // 使用总录制时长
            const countdownText = document.getElementById('recordCountdownText');
            countdownText.innerText = timeLeft;
            
            // 倒计时逻辑
            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    countdownText.innerText = timeLeft;
                } else {
                    clearInterval(timer);
                    if (mediaRecorder.state !== 'inactive') {
                        mediaRecorder.stop();
                    }
                }
            }, 1000);
        };

        // --- 录制 GIF 功能 ---
        window.startGifRecording = function() {
            if (isRecording) return;
            
            if (!gifWorkerBlobUrl) {
                alert("GIF 编码器还在加载中或加载失败，请检查网络后稍后再试！");
                return;
            }

            // 强制保持暂停状态，2秒后再开始运动
            isRunning = false;
            updatePlayBtnUI();
            
            setTimeout(() => {
                if (isRecording) {
                    isRunning = true;
                    updatePlayBtnUI();
                }
            }, 2000);
            
            const durationInput = document.getElementById('recordDuration');
            let duration = parseInt(durationInput.value);
            if (isNaN(duration) || duration <= 0) duration = 5; 
            
            // 【新增】将录制的总时长设定为：设定的运动时长 + 2秒的初始静止展示时长
            let totalDuration = duration + 2;
            
            isRecording = true;
            
            // 隐藏控制面板
            const panel = document.getElementById('controlPanel');
            panel.classList.remove('duration-500');
            panel.classList.add('opacity-0', 'pointer-events-none');
            
            const indicator = document.getElementById('recordingIndicator');
            indicator.classList.remove('opacity-0', 'pointer-events-none');
            
            let timeLeft = totalDuration; // 使用总录制时长
            const countdownText = document.getElementById('recordCountdownText');
            countdownText.innerText = timeLeft;

            // 初始化 GIF 对象
            const gif = new GIF({
                workers: 2,
                quality: 10,
                workerScript: gifWorkerBlobUrl,
                width: canvas.width,
                height: canvas.height
            });

            // 【关键修改】移除之前的2秒延迟等待，点击后立即开始抓取画面帧！
            // 这样前2秒的星体静止状态就会被一帧不落地录入GIF中。
            const frameInterval = setInterval(() => {
                gif.addFrame(canvas, { copy: true, delay: 50 });
            }, 50);

            // 倒计时逻辑
            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    countdownText.innerText = timeLeft;
                } else {
                    clearInterval(timer);
                    clearInterval(frameInterval); // 停止抓帧
                    
                    // 提示正在编码 (GIF 编码很消耗 CPU，需要一段时间)
                    indicator.innerHTML = `<svg class="w-4 h-4 mr-2 animate-spin" fill="currentColor" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>正在生成 GIF，请稍候...`;
                    
                    gif.on('finished', async function(blob) {
                        // 恢复 UI 状态
                        isRecording = false;
                        panel.classList.remove('opacity-0', 'pointer-events-none');
                        setTimeout(() => panel.classList.add('duration-500'), 50);
                        indicator.classList.add('opacity-0', 'pointer-events-none');
                        
                        // 恢复指示器的原始 HTML 结构，以便下次录制使用
                        setTimeout(() => {
                            indicator.innerHTML = `<svg class="w-4 h-4 mr-2 animate-pulse" fill="currentColor" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8"></circle></svg>正在录制... (<span id="recordCountdownText">0</span>s)`;
                        }, 500);

                        // 调用通用的保存功能
                        await saveFileAs(blob, `three-body-simulation.gif`, 'GIF 动图文件', {
                            'image/gif': ['.gif']
                        });
                    });
                    
                    // 开始渲染合并 GIF 文件
                    gif.render();
                }
            }, 1000);
        };

        // --- 下载 HTML 文件功能 ---
        window.downloadHTML = async function() {
            // 获取当前页面的完整 HTML 内容
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            
            await saveFileAs(blob, 'three-body-simulation.html', 'HTML 网页文件', {
                'text/html': ['.html']
            });
        };

        // --- 启动程序 ---
        window.onload = function() {
            resize();
            initFigure8(false); // 默认启动 8字形，但不自动播放 (暂停状态)
            animate();     // 开始动画循环 (此时只渲染不运算物理)
        }
    </script>

</body></html>
