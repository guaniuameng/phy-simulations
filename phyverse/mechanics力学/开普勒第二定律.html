        <p>在相等的时间内，行星与太阳的连线扫过的面积相等。</p>
    </div>

    <div class="content">
        <!-- 画布区域 -->
        <div class="canvas-container">
            <canvas id="simCanvas" width="600" height="450"></canvas>
        </div>

        <!-- 控制面板 -->
        <div class="controls">
            <div class="control-group">
                <button id="playPauseBtn">暂停动画</button>
            </div>

            <div class="control-group">
                <label>
                    <span>轨道偏心率 (e)</span>
                    <span id="eccValue">0.49</span>
                </label>
                <!-- 偏心率滑块 -->
                <input type="range" id="eccSlider" min="0" max="0.8" step="0.01" value="0.6">
            </div>

            <div class="control-group">
                <label>
                    <span>动画速度</span>
                    <span id="speedValue">1x</span>
                </label>
                <!-- 速度滑块 -->
                <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1">
            </div>

            <div class="control-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="showSectorsCheck" checked="">
                    显示等时扇区 (12等分)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="showDynamicCheck" checked="">
                    显示动态扫过面积
                </label>
            </div>

            <div class="info-box">
                <strong>物理启示：</strong><br>
                由于扫过的面积必须相等，当行星靠近太阳（近日点）时，它的移动速度会<strong>变快</strong>；而远离太阳（远日点）时，速度会<strong>变慢</strong>。
            </div>

            <div class="control-group">
                <button id="downloadBtn" style="background-color: #10b981; color: #f8fafc;">下载此动画 (HTML)</button>
                <button id="recordGifBtn" style="background-color: #8b5cf6; color: #f8fafc; margin-top: 10px;">生成完美循环 GIF</button>
            </div>
        </div>
    </div>
</div>

<script>
    // 获取DOM元素
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const eccSlider = document.getElementById('eccSlider');
    const speedSlider = document.getElementById('speedSlider');
    const eccValue = document.getElementById('eccValue');
    const speedValue = document.getElementById('speedValue');
    const showSectorsCheck = document.getElementById('showSectorsCheck');
    const showDynamicCheck = document.getElementById('showDynamicCheck');
    const downloadBtn = document.getElementById('downloadBtn');
    const recordGifBtn = document.getElementById('recordGifBtn');

    // 动画状态与物理参数
    let isPlaying = true;
    let time = 0;             // 模拟时间（对应平近点角 M）
    let speed = 0.005;        // 基础动画速度
    const a = 200;            // 椭圆半长轴 (固定，以适应画布)
    let e = parseFloat(eccSlider.value); // 偏心率

    // 更新UI显示
    eccSlider.addEventListener('input', (event) => {
        e = parseFloat(event.target.value);
        eccValue.textContent = e.toFixed(2);
    });

    speedSlider.addEventListener('input', (event) => {
        let multiplier = parseFloat(event.target.value);
        speedValue.textContent = multiplier.toFixed(1) + 'x';
        speed = 0.005 * multiplier;
    });

    playPauseBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playPauseBtn.textContent = isPlaying ? "暂停动画" : "继续动画";
    });

    // 下载HTML文件功能
    downloadBtn.addEventListener('click', () => {
        // 获取当前页面的完整 HTML 内容
        const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        // 创建一个 Blob 对象
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        // 创建一个指向 Blob 的 URL
        const url = URL.createObjectURL(blob);
        
        // 创建一个隐藏的 a 标签用于触发下载
        const a = document.createElement('a');
        a.href = url;
        a.download = 'kepler_second_law.html';
        document.body.appendChild(a);
        a.click();
        
        // 清理临时元素和 URL
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });

    // 求解开普勒方程 (M = E - e*sin(E)) 使用牛顿-拉弗森迭代法
    // M: 平近点角 (Mean Anomaly) - 与时间成正比
    // e: 偏心率
    // 返回: 偏近点角 E (Eccentric Anomaly)
    function solveKepler(M, e) {
        let E = M; // 初始猜测值
        for (let i = 0; i < 15; i++) {
            let dE = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
            E -= dE;
            if (Math.abs(dE) < 1e-6) break;
        }
        return E;
    }

    // 绘制扇形区域（太阳到轨道上两点之间的面积）
    // M1, M2 分别为起始和结束的平近点角
    function drawSector(context, M1, M2, color) {
        const b = a * Math.sqrt(1 - e * e); // 半短轴
        const focusX = a * e;               // 焦点（太阳）相对于中心的 X 坐标

        context.beginPath();
        // 起点：太阳中心
        context.moveTo(focusX, 0);

        // 细分角度以绘制平滑的椭圆弧线
        const steps = 30;
        for (let i = 0; i <= steps; i++) {
            let currentM = M1 + (M2 - M1) * (i / steps);
            let currentE = solveKepler(currentM, e);
            // 计算椭圆上的坐标（以椭圆中心为原点）
            let x = a * Math.cos(currentE);
            let y = b * Math.sin(currentE);
            context.lineTo(x, y);
        }
        
        context.closePath();
        context.fillStyle = color;
        context.fill();
        context.strokeStyle = "rgba(255, 255, 255, 0.2)";
        context.lineWidth = 1;
        context.stroke();
    }

    // 核心渲染逻辑，剥离出画布上下文和时间以便于复用
    function renderFrame(context, currentTime) {
        // 清空画布并填充背景色 (GIF需要实色背景，否则变透明)
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = "#020617";
        context.fillRect(0, 0, canvas.width, canvas.height);

        // 将坐标系原点移至画布中心 (这代表椭圆的几何中心)
        context.save();
        context.translate(canvas.width / 2, canvas.height / 2);

        const b = a * Math.sqrt(1 - e * e);
        const focusX = a * e;

        // 1. 绘制静态等时扇区 (12等分，代表相等的时间间隔)
        if (showSectorsCheck.checked) {
            const numSectors = 12;
            const deltaM = (2 * Math.PI) / numSectors;
            
            for (let i = 0; i < numSectors; i++) {
                let M1 = i * deltaM;
                let M2 = (i + 1) * deltaM;
                // 交替颜色以区分扇区
                let color = (i % 2 === 0) ? "rgba(56, 189, 248, 0.15)" : "rgba(56, 189, 248, 0.05)";
                drawSector(context, M1, M2, color);
            }
        }

        // 2. 绘制动态扫过的面积 (假设扫过时间为总周期的 1/12)
        if (showDynamicCheck.checked) {
            const sweepInterval = (2 * Math.PI) / 12;
            // 从当前时间往前推算一个时间间隔
            drawSector(context, currentTime - sweepInterval, currentTime, "rgba(16, 185, 129, 0.4)"); // 绿色高亮区域
        }

        // 3. 绘制轨道线 (完整的椭圆)
        context.beginPath();
        context.ellipse(0, 0, a, b, 0, 0, 2 * Math.PI);
        context.strokeStyle = "rgba(255, 255, 255, 0.4)";
        context.setLineDash([5, 5]); // 虚线
        context.lineWidth = 1.5;
        context.stroke();
        context.setLineDash([]); // 恢复实线

        // 4. 绘制太阳 (位于焦点 focusX)
        context.beginPath();
        context.arc(focusX, 0, 15, 0, 2 * Math.PI);
        
        // 太阳的发光渐变效果
        let gradient = context.createRadialGradient(focusX, 0, 5, focusX, 0, 20);
        gradient.addColorStop(0, "rgba(251, 191, 36, 1)");   // 中心黄色
        gradient.addColorStop(0.6, "rgba(245, 158, 11, 0.8)"); // 边缘橙色
        gradient.addColorStop(1, "rgba(245, 158, 11, 0)");   // 外围透明
        
        context.fillStyle = gradient;
        context.fill();

        // 5. 计算并绘制行星当前位置
        let E = solveKepler(currentTime, e);
        let planetX = a * Math.cos(E);
        let planetY = b * Math.sin(E);

        // 绘制行星与太阳的连线（向径）
        context.beginPath();
        context.moveTo(focusX, 0);
        context.lineTo(planetX, planetY);
        context.strokeStyle = "rgba(16, 185, 129, 0.8)"; // 绿色连线
        context.lineWidth = 2;
        context.stroke();

        // 绘制行星
        context.beginPath();
        context.arc(planetX, planetY, 8, 0, 2 * Math.PI);
        context.fillStyle = "#38bdf8"; // 亮蓝色
        context.fill();
        context.strokeStyle = "#fff";
        context.lineWidth = 1;
        context.stroke();

        context.restore();
    }

    // 主绘制循环
    function animationLoop() {
        renderFrame(ctx, time);

        // 更新时间逻辑
        if (isPlaying) {
            time += speed;
            // 保持时间在 0 到 2PI 之间循环
            if (time > 2 * Math.PI) {
                time -= 2 * Math.PI;
            }
        }

        // 循环调用动画
        requestAnimationFrame(animationLoop);
    }

    // 生成 GIF 图片逻辑
    let isRecording = false;
    recordGifBtn.addEventListener('click', async () => {
        if (isRecording) return;
        isRecording = true;
        const originalText = recordGifBtn.textContent;
        recordGifBtn.textContent = "正在准备 GIF 库...";
        recordGifBtn.disabled = true;

        try {
            // 动态获取 worker 脚本以避免跨域或被安全策略拦截
            const response = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
            const workerText = await response.text();
            const workerBlob = new Blob([workerText], { type: 'application/javascript' });
            const workerUrl = URL.createObjectURL(workerBlob);

            const gif = new GIF({
                workers: 2,
                quality: 10,
                workerScript: workerUrl,
                width: canvas.width,
                height: canvas.height
            });

            // 创建离屏 Canvas，用于后台瞬间计算无缝渲染动画，不影响您的当前观看界面
            const offCanvas = document.createElement('canvas');
            offCanvas.width = canvas.width;
            offCanvas.height = canvas.height;
            const offCtx = offCanvas.getContext('2d');

            // 计算一整圈的帧数，确保 GIF 完美循环
            const frames = 60; // 60 帧能提供丝滑且大小适中的循环
            const step = (2 * Math.PI) / frames;
            const delay = 1000 / 30; // ~33ms 每帧 (30 FPS)

            recordGifBtn.textContent = "正在生成运动轨迹...";

            for (let i = 0; i < frames; i++) {
                let t = i * step; // 精确计算这一帧对应的时间点
                renderFrame(offCtx, t);
                gif.addFrame(offCanvas, { copy: true, delay: delay });
            }

            gif.on('progress', p => {
                recordGifBtn.textContent = `图像编码中... ${Math.round(p * 100)}%`;
            });

            gif.on('finished', function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'kepler_animation_loop.gif';
                document.body.appendChild(a);
                a.click();
                
                // 清理临时对象
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                URL.revokeObjectURL(workerUrl);

                recordGifBtn.textContent = originalText;
                recordGifBtn.disabled = false;
                isRecording = false;
            });

            gif.render();

        } catch (err) {
            console.error("GIF 录制失败:", err);
            alert("生成 GIF 失败。这可能是因为网络限制导致无法加载外部 GIF 库，请检查网络后再试。");
            recordGifBtn.textContent = originalText;
            recordGifBtn.disabled = false;
            isRecording = false;
        }
    });

    // 启动动画循环
    animationLoop();
</script></body></html>
