<body>

<div class="container">
    <div class="text-center">
        <h1 class="text-2xl font-bold text-white mb-2">同方向同频率简谐振动的合成</h1>
        <p class="text-slate-400 text-sm">左侧：旋转矢量图（平行四边形法则） | 右侧：振动位移-时间图（波形展开）</p>
    </div>

    <!-- 动画画布容器 -->
    <div class="canvas-container">
        <canvas id="simCanvas" width="1000" height="400"></canvas>
    </div>

    <div class="flex justify-center gap-4">
        <button id="playBtn" class="btn">暂停动画</button>
        <button id="resetBtn" class="btn btn-reset">重置波形</button>
    </div>

    <!-- 控制面板 -->
    <div class="main-controls-container">
        <!-- 左侧面板：控制输入与快捷按钮 -->
        <div class="left-panel">
            <div class="vibrations-grid">
                <!-- 分振动 1 控制 -->
                <div class="control-group color-v1">
                    <h3>分振动 1 (蓝色)</h3>
                    <div class="input-row">
                        <label>振幅 A₁:</label>
                        <div class="num-wrapper">
                            <input type="number" id="num-a1" class="val-input" value="70">
                        </div>
                    </div>
                    <div class="input-row">
                        <label>初相位 φ₁:</label>
                        <div class="num-wrapper">
                            <input type="number" id="num-p1" class="val-input" value="0"><span>°</span>
                        </div>
                    </div>
                </div>

                <!-- 分振动 2 控制 -->
                <div class="control-group color-v2">
                    <h3>分振动 2 (绿色)</h3>
                    <div class="input-row">
                        <label>振幅 A₂:</label>
                        <div class="num-wrapper">
                            <input type="number" id="num-a2" class="val-input" value="50">
                        </div>
                    </div>
                    <div class="input-row">
                        <label>初相位 φ₂:</label>
                        <div class="num-wrapper">
                            <input type="number" id="num-p2" class="val-input" value="60"><span>°</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 快捷设置面板 -->
            <div class="control-group" style="border-top: 1px dashed #334155; padding-top: 15px;">
                <h3 style="border-bottom: none; color: #94a3b8; font-size: 14px;">快速设置 (一键调整相位差 Δφ)</h3>
                <div class="quick-btn-group">
                    <button id="btn-p0" class="quick-btn">Δφ = 0° (同相)</button>
                    <button id="btn-p60" class="quick-btn">Δφ = 60°</button>
                    <button id="btn-p180" class="quick-btn">Δφ = 180° (反相)</button>
                </div>
            </div>
        </div>

        <!-- 右侧面板：实时计算结果与公式 -->
        <div class="control-group">
            <h3 class="color-vr">合振动结果分析 (红色)</h3>
            <div class="formula-box">
                <div>合振幅 <math style="font-size: 16px;"><mi>A</mi></math> = <span id="res-a" class="text-red-400 font-bold text-lg">104.4</span></div>
                <div>合初相 <math style="font-size: 16px;"><mi>φ</mi></math> = <span id="res-p" class="text-red-400 font-bold text-lg">24.5</span>°</div>
                <div class="mt-3 pt-4 border-t border-slate-600">
                    <div class="math-wrapper">
                        <math xmlns="http://www.w3.org/1998/Math/MathML" display="block" class="math-block">
                            <mi>A</mi>
                            <mo>=</mo>
                            <msqrt>
                                <msubsup><mi>A</mi><mn>1</mn><mn>2</mn></msubsup>
                                <mo>+</mo>
                                <msubsup><mi>A</mi><mn>2</mn><mn>2</mn></msubsup>
                                <mo>+</mo>
                                <mn>2</mn><msub><mi>A</mi><mn>1</mn></msub><msub><mi>A</mi><mn>2</mn></msub>
                                <mi>cos</mi>
                                <mo>(</mo>
                                <mi>Δ</mi><mi>φ</mi>
                                <mo>)</mo>
                            </msqrt>
                        </math>
                        <math xmlns="http://www.w3.org/1998/Math/MathML" display="block" class="math-block">
                            <mi>tan</mi><mi>φ</mi>
                            <mo>=</mo>
                            <mfrac>
                                <mrow>
                                    <msub><mi>A</mi><mn>1</mn></msub><mi>sin</mi><msub><mi>φ</mi><mn>1</mn></msub>
                                    <mo>+</mo>
                                    <msub><mi>A</mi><mn>2</mn></msub><mi>sin</mi><msub><mi>φ</mi><mn>2</mn></msub>
                                </mrow>
                                <mrow>
                                    <msub><mi>A</mi><mn>1</mn></msub><mi>cos</mi><msub><mi>φ</mi><mn>1</mn></msub>
                                    <mo>+</mo>
                                    <msub><mi>A</mi><mn>2</mn></msub><mi>cos</mi><msub><mi>φ</mi><mn>2</mn></msub>
                                </mrow>
                            </mfrac>
                        </math>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<button id="downloadBtn" class="download-btn">下载此 HTML 源码文件</button>

<script>
// 确保 DOM 完全加载后再执行动画代码
window.onload = function () {
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // 状态配置对象
    let config = {
        a1: 70,       // 振幅1
        p1: 0,        // 初相1 (角度)
        a2: 50,       // 振幅2
        p2: 60,       // 初相2 (角度)
        omega: 0.025, // 角速度 (决定动画播放快慢)
    };

    let time = 0;
    let isPlaying = true;
    let waveHistory = []; // 存储波形历史坐标点
    const MAX_HISTORY = 520; // 波形总长度
    
    // 获取UI控件
    const elements = {
        numA1: document.getElementById('num-a1'),
        numP1: document.getElementById('num-p1'),
        numA2: document.getElementById('num-a2'),
        numP2: document.getElementById('num-p2'),
        resA: document.getElementById('res-a'),
        resP: document.getElementById('res-p'),
        playBtn: document.getElementById('playBtn'),
        resetBtn: document.getElementById('resetBtn'),
        btnP0: document.getElementById('btn-p0'),
        btnP60: document.getElementById('btn-p60'),
        btnP180: document.getElementById('btn-p180')
    };

    // 角度转弧度辅助函数
    const deg2rad = (deg) => deg * Math.PI / 180;

    // 更新数学计算结果
    function updateResultantMath() {
        const radP1 = deg2rad(config.p1);
        const radP2 = deg2rad(config.p2);
        
        // 余弦定理计算合振幅
        const resA = Math.sqrt(
            Math.pow(config.a1, 2) + Math.pow(config.a2, 2) + 
            2 * config.a1 * config.a2 * Math.cos(radP2 - radP1)
        );

        // 计算合初相
        const sumY = config.a1 * Math.sin(radP1) + config.a2 * Math.sin(radP2);
        const sumX = config.a1 * Math.cos(radP1) + config.a2 * Math.cos(radP2);
        let resP = Math.atan2(sumY, sumX) * 180 / Math.PI;
        if (resP < 0) resP += 360;

        elements.resA.innerText = resA.toFixed(1);
        elements.resP.innerText = resP.toFixed(1);
    }

    // 设置事件监听器
    function setupEvents() {
        const bindControls = (numInput, key, min, max) => {
            // 数值框输入中 -> 尝试更新动画配置
            numInput.addEventListener('input', (e) => {
                let val = parseFloat(e.target.value);
                if (!isNaN(val)) {
                    config[key] = val;
                    updateResultantMath();
                }
            });

            // 数值框失去焦点 -> 限制最大/最小值防错
            numInput.addEventListener('blur', (e) => {
                let val = parseFloat(e.target.value);
                if (isNaN(val)) val = config[key]; // 如果输入非法，恢复原值
                
                val = Math.max(min, Math.min(max, val)); // 将值限制在允许范围内
                
                e.target.value = val;
                config[key] = val;
                updateResultantMath();
            });
        };

        // 绑定输入框事件 (设置合理的最大最小值防错)
        bindControls(elements.numA1, 'a1', 0, 150);
        bindControls(elements.numP1, 'p1', -3600, 3600);
        bindControls(elements.numA2, 'a2', 0, 150);
        bindControls(elements.numP2, 'p2', -3600, 3600);

        // 绑定快捷设置按钮
        const setPhaseDiff = (diff) => {
            let newP2 = (config.p1 + diff) % 360;
            if(newP2 < 0) newP2 += 360; // 保持在 0-360 范围内显示更好看
            config.p2 = newP2;
            elements.numP2.value = newP2;
            updateResultantMath();
        };

        elements.btnP0.addEventListener('click', () => setPhaseDiff(0));
        elements.btnP60.addEventListener('click', () => setPhaseDiff(60));
        elements.btnP180.addEventListener('click', () => setPhaseDiff(180));

        elements.playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            elements.playBtn.innerText = isPlaying ? "暂停动画" : "继续动画";
            elements.playBtn.style.backgroundColor = isPlaying ? "#3b82f6" : "#f59e0b";
        });

        elements.resetBtn.addEventListener('click', () => {
            waveHistory = [];
            time = 0;
            // 短暂显示清空效果
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // 下载功能代码
        document.getElementById('downloadBtn').addEventListener('click', () => {
            // 抓取当前整个页面的 HTML 文本并创建文件对象
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "harmonic_synthesis.html"; // 下载的默认文件名
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        updateResultantMath();
    }

    // 绘制带箭头的线段
    function drawArrow(ctx, fromx, fromy, tox, toy, color, lineWidth = 3) {
        const headlen = 12; // 箭头长度
        const dx = tox - fromx;
        const dy = toy - fromy;
        const angle = Math.atan2(dy, dx);
        
        // 如果长度为0，不绘制
        if (dx === 0 && dy === 0) return;

        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        ctx.moveTo(fromx, fromy);
        ctx.lineTo(tox, toy);
        ctx.stroke();
        
        // 绘制箭头尖端
        ctx.beginPath();
        ctx.fillStyle = color;
        ctx.moveTo(tox, toy);
        ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 7), toy - headlen * Math.sin(angle - Math.PI / 7));
        ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 7), toy - headlen * Math.sin(angle + Math.PI / 7));
        ctx.fill();
    }

    // 绘制虚线
    function drawDashedLine(ctx, x1, y1, x2, y2, color) {
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.setLineDash([]); // 恢复实线
    }

    // 绘制背景网格
    function drawGrid() {
        ctx.beginPath();
        ctx.strokeStyle = "#1e293b";
        ctx.lineWidth = 1;
        // 垂直线
        for(let x = 0; x <= canvas.width; x += 50) {
            ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
        }
        // 水平线
        for(let y = 0; y <= canvas.height; y += 50) {
            ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
        }
        ctx.stroke();
    }

    // 主动画循环
    function animate() {
        // 清理画布
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();

        // 布局参数
        const centerX = 200;
        const centerY = 200;
        const waveStartX = 450;
        
        // 计算当前角度 (随时间增加而逆时针旋转)
        const radP1 = deg2rad(config.p1);
        const radP2 = deg2rad(config.p2);
        const theta1 = config.omega * time + radP1;
        const theta2 = config.omega * time + radP2;

        // 计算分矢量终点坐标 (Canvas的Y轴向下，数学中Y轴向上，因此需要减去)
        const v1x = centerX + config.a1 * Math.cos(theta1);
        const v1y = centerY - config.a1 * Math.sin(theta1);

        const v2x = centerX + config.a2 * Math.cos(theta2);
        const v2y = centerY - config.a2 * Math.sin(theta2);

        // 计算合矢量终点坐标 (矢量分量直接相加)
        const vxResult = (v1x - centerX) + (v2x - centerX);
        const vyResult = (v1y - centerY) + (v2y - centerY);
        const pRx = centerX + vxResult;
        const pRy = centerY + vyResult;

        // ------------------ 左侧：旋转矢量区 ------------------
        
        // 绘制坐标轴
        ctx.beginPath();
        ctx.strokeStyle = "#475569";
        ctx.lineWidth = 1.5;
        // X轴与Y轴
        ctx.moveTo(30, centerY); ctx.lineTo(400, centerY); 
        ctx.moveTo(centerX, 30); ctx.lineTo(centerX, 370); 
        ctx.stroke();
        
        // 绘制振幅参考圆
        ctx.beginPath();
        ctx.arc(centerX, centerY, config.a1, 0, 2 * Math.PI);
        ctx.strokeStyle = "rgba(56, 189, 248, 0.15)";
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(centerX, centerY, config.a2, 0, 2 * Math.PI);
        ctx.strokeStyle = "rgba(74, 222, 128, 0.15)";
        ctx.stroke();

        // 绘制平行四边形辅助线
        drawDashedLine(ctx, v1x, v1y, pRx, pRy, "rgba(248, 113, 113, 0.4)");
        drawDashedLine(ctx, v2x, v2y, pRx, pRy, "rgba(248, 113, 113, 0.4)");

        // 绘制三个旋转矢量
        drawArrow(ctx, centerX, centerY, v1x, v1y, "#38bdf8", 3); // 矢量1 蓝
        drawArrow(ctx, centerX, centerY, v2x, v2y, "#4ade80", 3); // 矢量2 绿
        drawArrow(ctx, centerX, centerY, pRx, pRy, "#f87171", 4); // 合矢量 红

        // ------------------ 波形数据计算 ------------------
        
        if (isPlaying) {
            // 将当前的Y坐标推入历史记录 (用于向右绘制波形)
            waveHistory.unshift({ y1: v1y, y2: v2y, yr: pRy });
            // 维持数组长度在最大范围内
            if (waveHistory.length > MAX_HISTORY) {
                waveHistory.pop();
            }
            time++;
        }

        // ------------------ 右侧：波形展开区 ------------------
        
        // 绘制波形坐标系
        ctx.beginPath();
        ctx.strokeStyle = "#475569";
        ctx.moveTo(waveStartX, centerY); ctx.lineTo(canvas.width - 20, centerY); // 时间轴
        ctx.moveTo(waveStartX, 30); ctx.lineTo(waveStartX, 370); // Y轴起始线
        ctx.stroke();

        // 绘制从矢量端点到波形图起点的水平投影虚线
        drawDashedLine(ctx, v1x, v1y, waveStartX, v1y, "rgba(56, 189, 248, 0.4)");
        drawDashedLine(ctx, v2x, v2y, waveStartX, v2y, "rgba(74, 222, 128, 0.4)");
        drawDashedLine(ctx, pRx, pRy, waveStartX, pRy, "rgba(248, 113, 113, 0.4)");

        // 绘制历史波形曲线的方法
        const drawWaveLine = (color, key, lineWidth) => {
            if (waveHistory.length === 0) return;
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            // 设置线条连接样式，使曲线更平滑
            ctx.lineJoin = 'round';
            for(let i = 0; i < waveHistory.length; i++) {
                const x = waveStartX + i; // 1帧像素点宽度
                const y = waveHistory[i][key];
                if(i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        };

        // 执行波形绘制
        if (waveHistory.length > 0) {
            drawWaveLine("#38bdf8", "y1", 2); // 波形1
            drawWaveLine("#4ade80", "y2", 2); // 波形2
            drawWaveLine("#f87171", "yr", 3); // 合成波形
        }

        // ------------------ 文本与标签 ------------------
        
        ctx.font = "13px 'Segoe UI', sans-serif";
        // 矢量标签跟随运动
        ctx.fillStyle = "#38bdf8"; ctx.fillText("A₁", v1x + 5, v1y - 5);
        ctx.fillStyle = "#4ade80"; ctx.fillText("A₂", v2x + 5, v2y - 5);
        ctx.font = "bold 14px 'Segoe UI', sans-serif";
        ctx.fillStyle = "#f87171"; ctx.fillText("A", pRx + 5, pRy - 5);
        
        // 坐标轴标签
        ctx.fillStyle = "#94a3b8";
        ctx.font = "14px 'Segoe UI', sans-serif";
        ctx.fillText("x (投影位移)", waveStartX - 80, 25);
        ctx.fillText("t (时间) →", canvas.width - 80, centerY + 20);
        ctx.fillText("y", centerX + 10, 25);
        ctx.fillText("x", 400, centerY - 10);

        // 循环调用下一帧
        requestAnimationFrame(animate);
    }

    // 初始化运行
    setupEvents();
    animate();
};
</script>

</body></html>
