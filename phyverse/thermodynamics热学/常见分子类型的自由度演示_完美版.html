<!-- 强制屏幕大小，防止产生系统级滚动条 -->
<body class="flex flex-col md:flex-row w-screen h-screen overflow-hidden bg-slate-50">

    <!-- 左侧控制面板 -->
    <div class="w-full md:w-80 bg-white shadow-xl z-10 flex flex-col h-full border-r border-slate-200 flex-shrink-0">
        
        <div class="overflow-y-auto flex-grow">
            <div class="p-5 border-b border-slate-100">
                <h1 class="text-xl font-bold text-slate-800 flex items-center">
                    <svg class="w-6 h-6 mr-2 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                    分子自由度演示
                </h1>
                <div class="mt-3 bg-orange-50 border border-orange-200 text-orange-800 text-xs p-3 rounded-md">
                    <span class="font-bold text-red-600">注意：</span> 本演示中假设分子为刚性分子，因此<strong>忽略振动自由度</strong>。
                </div>
            </div>

            <div class="p-5 border-b border-slate-100">
                <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">1. 选择分子类型</h2>
                <div class="space-y-2">
                    <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-slate-50 transition-colors" id="label-mono">
                        <input type="radio" name="molecule" value="mono" class="form-radio text-red-500 h-4 w-4" checked="" onchange="changeMolecule('mono')">
                        <span class="ml-3 font-medium text-slate-700">单原子分子</span>
                    </label>
                    <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-slate-50 transition-colors" id="label-dia">
                        <input type="radio" name="molecule" value="dia" class="form-radio text-red-500 h-4 w-4" onchange="changeMolecule('dia')">
                        <span class="ml-3 font-medium text-slate-700">双原子分子</span>
                    </label>
                    <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-slate-50 transition-colors" id="label-poly">
                        <input type="radio" name="molecule" value="poly" class="form-radio text-red-500 h-4 w-4" onchange="changeMolecule('poly')">
                        <span class="ml-3 font-medium text-slate-700">三及多原子分子</span>
                    </label>
                </div>
            </div>

            <div class="p-5 bg-slate-50 border-b border-slate-100">
                <div class="border border-orange-300 bg-white p-3 rounded text-center shadow-sm">
                    <div class="text-slate-700 text-sm mb-1" id="info-trans">平动自由度 <span class="font-mono text-red-600">x, y, z</span> (3)</div>
                    <div class="text-slate-700 text-sm mb-2" id="info-rot">转动自由度 <span class="font-mono text-blue-600">α, β</span> (2)</div>
                    <div class="font-bold text-lg text-slate-800" id="info-total">总自由度 i = 5</div>
                </div>
            </div>

            <div class="p-5">
                <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">2. 演示运动 (自由度)</h2>
                
                <div class="mb-4">
                    <h3 class="text-xs font-semibold text-slate-400 mb-2">平动 (Translation)</h3>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="playAnimation('tx')" id="btn-tx" class="py-2 border border-slate-300 rounded text-slate-600 hover:bg-slate-100 transition-colors text-sm font-medium">沿 X 轴</button>
                        <button onclick="playAnimation('ty')" id="btn-ty" class="py-2 border border-slate-300 rounded text-slate-600 hover:bg-slate-100 transition-colors text-sm font-medium">沿 Y 轴</button>
                        <button onclick="playAnimation('tz')" id="btn-tz" class="py-2 border border-slate-300 rounded text-slate-600 hover:bg-slate-100 transition-colors text-sm font-medium">沿 Z 轴</button>
                    </div>
                </div>

                <div class="mb-6">
                    <h3 class="text-xs font-semibold text-slate-400 mb-2">转动 (Rotation)</h3>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="playAnimation('rx')" id="btn-rx" class="py-2 border border-slate-300 rounded text-slate-600 hover:bg-slate-100 transition-colors text-sm font-medium">绕 X' (β)</button>
                        <button onclick="playAnimation('ry')" id="btn-ry" class="py-2 border border-slate-300 rounded text-slate-600 hover:bg-slate-100 transition-colors text-sm font-medium btn-disabled" disabled="">绕 Y' (φ)</button>
                        <button onclick="playAnimation('rz')" id="btn-rz" class="py-2 border border-slate-300 rounded text-slate-600 hover:bg-slate-100 transition-colors text-sm font-medium btn-active">绕 Z' (α)</button>
                    </div>
                </div>

                <button onclick="stopAnimation()" class="w-full py-3 bg-slate-800 text-white rounded-lg hover:bg-slate-700 transition-colors font-medium shadow-md flex justify-center items-center">
                    <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>
                    停止运动复位 (恢复视角)
                </button>
            </div>
        </div>

        <div class="p-5 border-t border-slate-200 bg-slate-50">
            <button onclick="downloadHTML()" class="w-full py-2.5 bg-white border-2 border-indigo-500 text-indigo-600 rounded-lg hover:bg-indigo-50 transition-colors font-bold shadow-sm flex justify-center items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                下载此 HTML 文件
            </button>
        </div>
    </div>

    <!-- 右侧 3D 画布 -->
    <div id="canvas-container" class="flex-1 h-full relative cursor-move overflow-hidden">
        <div class="absolute top-4 right-4 bg-white/80 backdrop-blur-sm p-3 rounded-lg shadow-lg pointer-events-none border border-slate-100 z-10">
            <div id="current-action-label" class="font-bold text-red-500 text-lg mb-1">当前：绕 Z' 轴转动 (夹角 α)</div>
            <div class="text-xs text-slate-500 flex items-start">
                <svg class="w-4 h-4 mr-1 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>鼠标左键可拖拽视角<br>灰色坐标系(x',y',z')保持绝对静止</span>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let molecules = {}; 
        let currentMoleculeType = 'mono'; 
        let currentAnimation = 'none'; 
        let animationTime = 0; 
        
        let globalAxes; 
        let localAxesGroup; 
        
        let staticIndicators = {}; 
        let dynArcMesh, dynCone;   
        let dynLabels = {};        

        const config = {
            atomColor: 0xff4444, bondColor: 0xcccccc, 
            atomRadius: 0.4, bondRadius: 0.1, transAmp: 2.5 
        };

        function init() {
            const container = document.getElementById('canvas-container');
            
            // 【关键修复】如果容器内已经存在由于刷新或下载残留的旧 canvas，先清除它，防止叠加挤占高度
            const existingCanvas = container.querySelector('canvas');
            if (existingCanvas) {
                existingCanvas.remove();
            }

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf8fafc); 

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.up.set(0, 0, 1); 
            
            // 【构图优化】稍微拉远并抬高视角，完美容纳所有元素
            camera.position.set(9, 9, 7);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio); // 提升清晰度
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // 【构图优化】将观察中心点设置在世界坐标原点与分子之间的中央，防止分子跑出视野
            controls.target.set(1.5, 1.5, 1.5);
            controls.update(); // 必须立即更新，锁定视角

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(10, 10, 15);
            dirLight.castShadow = true;
            scene.add(dirLight);
            
            buildEnvironment();
            buildMolecules();
            initDynamicIndicators();

            window.addEventListener('resize', onWindowResize, false);
            // 防止字体等异步加载导致布局初次计算不准确，延迟执行一次尺寸调整
            setTimeout(onWindowResize, 100); 

            animateLoop();
            updateUIState();
        }

        // 创建3D文字标签
        function makeTextSprite(message, color, fontSize = 60, fontStyle = "Bold") {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 256; canvas.height = 128;
            context.font = `${fontStyle} ${fontSize}px "Times New Roman", Arial`;
            context.fillStyle = color;
            context.textAlign = "center"; context.textBaseline = "middle";
            context.fillText(message, canvas.width/2, canvas.height/2);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false }));
            sprite.scale.set(2, 1, 1);
            return sprite;
        }

        // 创建带有箭头的直线坐标轴
        function createAxisLine(p1, p2, color, labelText, isDashed = false) {
            const group = new THREE.Group();
            
            let mat;
            if (isDashed) {
                mat = new THREE.LineDashedMaterial({ color: color, linewidth: 2, dashSize: 0.2, gapSize: 0.15 });
            } else {
                mat = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
            }
            
            const geometry = new THREE.BufferGeometry().setFromPoints([p1, p2]);
            const line = new THREE.Line(geometry, mat);
            if (isDashed) line.computeLineDistances(); 
            group.add(line);
            
            const cone = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.5, 8), new THREE.MeshBasicMaterial({ color: color }));
            cone.position.copy(p2);
            cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3().subVectors(p2, p1).normalize());
            group.add(cone);
            
            if(labelText) {
                const hexColor = typeof color === 'number' ? '#' + color.toString(16).padStart(6, '0') : color;
                const spr = makeTextSprite(labelText, hexColor, 70, "italic bold");
                spr.position.copy(p2).add(new THREE.Vector3().subVectors(p2, p1).normalize().multiplyScalar(0.6));
                group.add(spr);
            }
            return group;
        }

        // 创建静态虚线圆弧
        function createStaticArc(axisStr, radius, startAngle, endAngle) {
            const points = [];
            const segments = 40;
            const angleStep = (endAngle - startAngle) / segments;
            
            for (let i = 0; i <= segments; i++) {
                const a = startAngle + i * angleStep;
                let x = 0, y = 0, z = 0;
                if (axisStr === 'z') { x = radius * Math.sin(a); y = radius * Math.cos(a); } 
                else if (axisStr === 'x') { y = radius * Math.cos(a); z = radius * Math.sin(a); } 
                else if (axisStr === 'y') { x = radius * Math.sin(a); z = radius * Math.cos(a); }
                points.push(new THREE.Vector3(x, y, z));
            }
            const mat = new THREE.LineDashedMaterial({ color: 0xcbd5e1, dashSize: 0.1, gapSize: 0.05, linewidth: 1 });
            const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), mat);
            line.computeLineDistances();
            return line;
        }

        function buildEnvironment() {
            // 全局固定轴 (实线)
            globalAxes = new THREE.Group();
            globalAxes.add(createAxisLine(new THREE.Vector3(0,0,0), new THREE.Vector3(5,0,0), 0x000000, "X", false));
            globalAxes.add(createAxisLine(new THREE.Vector3(0,0,0), new THREE.Vector3(0,5,0), 0x000000, "Y", false));
            globalAxes.add(createAxisLine(new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,5), 0x000000, "Z", false));
            
            const labelO = makeTextSprite("O", "black", 70, "italic bold");
            labelO.position.set(-0.3, -0.3, -0.3);
            globalAxes.add(labelO);
            
            scene.add(globalAxes);
            
            // 局部固定轴 (x', y', z') 虚线
            localAxesGroup = new THREE.Group();
            localAxesGroup.add(createAxisLine(new THREE.Vector3(0,0,0), new THREE.Vector3(3.5,0,0), 0x94a3b8, "x'", true));
            localAxesGroup.add(createAxisLine(new THREE.Vector3(0,0,0), new THREE.Vector3(0,3.5,0), 0x94a3b8, "y'", true));
            localAxesGroup.add(createAxisLine(new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,3.5), 0x94a3b8, "z'", true));
            
            const labelOPrime = makeTextSprite("O'", "#94a3b8", 70, "italic bold");
            labelOPrime.position.set(-0.3, -0.3, -0.3);
            localAxesGroup.add(labelOPrime);
            
            staticIndicators.alpha = createStaticArc('z', 2.0, 0, Math.PI / 2);
            staticIndicators.beta = createStaticArc('x', 2.0, 0, Math.PI / 2);
            staticIndicators.phi = createStaticArc('y', 0.8, 0, Math.PI * 2);
            staticIndicators.phi.position.set(0, 2.5, 0);

            localAxesGroup.add(staticIndicators.alpha, staticIndicators.beta, staticIndicators.phi);
            scene.add(localAxesGroup);
            localAxesGroup.visible = false; 
        }

        function initDynamicIndicators() {
            dynArcMesh = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xef4444, linewidth: 4 }));
            dynCone = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.45, 8), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
            
            dynLabels.alpha = makeTextSprite('α', '#ef4444', 110, 'italic bold');
            dynLabels.beta = makeTextSprite('β', '#ef4444', 110, 'italic bold');
            dynLabels.phi = makeTextSprite('φ', '#ef4444', 110, 'italic bold');

            localAxesGroup.add(dynArcMesh, dynCone, dynLabels.alpha, dynLabels.beta, dynLabels.phi);
            hideDynamicArc();
        }

        function hideDynamicArc() {
            dynArcMesh.visible = false;
            dynCone.visible = false;
            Object.values(dynLabels).forEach(l => l.visible = false);
        }

        function drawDynamicArc(axisStr, angle, radius, labelName, offset) {
            if (Math.abs(angle) < 0.01) { hideDynamicArc(); return; }

            dynArcMesh.visible = true;
            dynCone.visible = true;
            
            Object.keys(dynLabels).forEach(k => dynLabels[k].visible = false);
            const activeLabel = labelName === 'α' ? dynLabels.alpha : (labelName === 'β' ? dynLabels.beta : dynLabels.phi);
            activeLabel.visible = true;

            const points = [];
            const segments = 30;
            const step = angle / segments;

            for (let i = 0; i <= segments; i++) {
                const a = i * step;
                let x=0, y=0, z=0;
                if (axisStr === 'z') { 
                    x = radius * Math.sin(a);
                    y = radius * Math.cos(a);
                } else if (axisStr === 'x') { 
                    y = radius * Math.cos(a);
                    z = radius * Math.sin(a);
                } else if (axisStr === 'y') { 
                    x = radius * Math.sin(a);
                    z = radius * Math.cos(a);
                }
                points.push(new THREE.Vector3(x, y, z));
            }

            dynArcMesh.geometry.setFromPoints(points);

            const endPt = points[segments].clone();
            const prevPt = points[segments - 1].clone();
            if (offset) {
                endPt.add(offset);
                prevPt.add(offset);
                dynArcMesh.position.copy(offset);
            } else {
                dynArcMesh.position.set(0,0,0);
            }

            dynCone.position.copy(endPt);
            dynCone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3().subVectors(endPt, prevPt).normalize());

            const midPt = points[Math.floor(segments/2)].clone();
            if (axisStr === 'z') { midPt.x *= 1.3; midPt.y *= 1.3; }
            if (axisStr === 'x') { midPt.y *= 1.3; midPt.z *= 1.3; }
            if (axisStr === 'y') { midPt.x *= 1.5; midPt.z *= 1.5; }
            if (offset) midPt.add(offset);
            activeLabel.position.copy(midPt);
        }

        function buildMolecules() {
            const atomMat = new THREE.MeshStandardMaterial({ color: config.atomColor, roughness: 0.2, metalness: 0.1 });
            const bondMat = new THREE.MeshStandardMaterial({ color: config.bondColor, roughness: 0.5 });
            const sphereGeo = new THREE.SphereGeometry(config.atomRadius, 32, 32);

            molecules.mono = new THREE.Group();
            molecules.mono.add(new THREE.Mesh(sphereGeo, atomMat));
            
            molecules.dia = new THREE.Group();
            const dist = 2.5;
            const a1 = new THREE.Mesh(sphereGeo, atomMat); a1.position.set(0, 0, 0);
            const a2 = new THREE.Mesh(sphereGeo, atomMat); a2.position.set(0, dist, 0);
            const b = new THREE.Mesh(new THREE.CylinderGeometry(config.bondRadius, config.bondRadius, dist, 16), bondMat);
            b.position.set(0, dist / 2, 0);
            molecules.dia.add(a1, a2, b);

            molecules.poly = new THREE.Group();
            const p1 = new THREE.Vector3(0, 0, 0);
            const p2 = new THREE.Vector3(0, dist, 0);
            const p3 = new THREE.Vector3(1.5, dist * 0.7, 0);
            
            const polyAtom1 = new THREE.Mesh(sphereGeo, atomMat); polyAtom1.position.copy(p1);
            const polyAtom2 = new THREE.Mesh(sphereGeo, atomMat); polyAtom2.position.copy(p2);
            const polyAtom3 = new THREE.Mesh(sphereGeo, atomMat); polyAtom3.position.copy(p3);
            
            molecules.poly.add(polyAtom1, polyAtom2, polyAtom3);
            
            const createBond = (v1, v2) => {
                const mesh = new THREE.Mesh(new THREE.CylinderGeometry(config.bondRadius, config.bondRadius, v1.distanceTo(v2), 16), bondMat);
                mesh.position.copy(v2).add(v1).divideScalar(2);
                mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), v2.clone().sub(v1).normalize());
                return mesh;
            };
            molecules.poly.add(createBond(p1, p2), createBond(p2, p3), createBond(p3, p1));

            const startPos = new THREE.Vector3(2, 2, 2);
            for (let key in molecules) {
                molecules[key].position.copy(startPos);
                scene.add(molecules[key]);
                molecules[key].visible = false;
            }
            localAxesGroup.position.copy(startPos);
            molecules.mono.visible = true;
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            if(width === 0 || height === 0) return;
            
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            controls.update();
            
            const activeMol = molecules[currentMoleculeType];
            const startPos = new THREE.Vector3(2, 2, 2);

            if (currentAnimation !== 'none') {
                animationTime += 0.05;
                activeMol.position.copy(startPos);
                activeMol.rotation.set(0, 0, 0);

                let curAngle = 0;
                const pendulum = Math.sin(animationTime); 

                switch (currentAnimation) {
                    case 'tx':
                        activeMol.position.x = startPos.x + pendulum * config.transAmp;
                        break;
                    case 'ty':
                        activeMol.position.y = startPos.y + pendulum * config.transAmp;
                        break;
                    case 'tz':
                        activeMol.position.z = startPos.z + pendulum * config.transAmp;
                        break;
                    case 'rx': 
                        curAngle = (Math.sin(animationTime) * 0.5 + 0.5) * Math.PI * 0.35; 
                        activeMol.rotation.x = curAngle;
                        drawDynamicArc('x', curAngle, 2.0, 'β', null);
                        break;
                    case 'ry': 
                        curAngle = (animationTime) % (Math.PI * 2); 
                        activeMol.rotation.y = curAngle;
                        drawDynamicArc('y', curAngle, 0.8, 'φ', new THREE.Vector3(0, 2.5, 0));
                        break;
                    case 'rz': 
                        curAngle = (Math.sin(animationTime) * 0.5 + 0.5) * Math.PI * 0.35; 
                        activeMol.rotation.z = -curAngle; 
                        drawDynamicArc('z', curAngle, 2.0, 'α', null);
                        break;
                }
                
                localAxesGroup.position.copy(activeMol.position);
            }

            renderer.render(scene, camera);
        }

        window.changeMolecule = function(type) {
            currentMoleculeType = type;
            stopAnimation();
            
            for (let key in molecules) { molecules[key].visible = (key === type); }
            
            localAxesGroup.visible = (type !== 'mono'); 
            
            if(type !== 'mono') {
                staticIndicators.alpha.visible = true;
                staticIndicators.beta.visible = true;
                staticIndicators.phi.visible = (type === 'poly');
            }
            updateUIState();
        }

        window.playAnimation = function(animType) {
            currentAnimation = animType;
            animationTime = 0;
            
            ['tx', 'ty', 'tz', 'rx', 'ry', 'rz'].forEach(type => {
                const btn = document.getElementById('btn-' + type);
                if(btn && !btn.disabled) {
                    btn.classList.remove('btn-active');
                    if(type === animType) btn.classList.add('btn-active');
                }
            });
            
            if (['tx','ty','tz'].includes(animType)) hideDynamicArc(); 

            const labels = {
                'tx': '沿 X 轴平动', 'ty': '沿 Y 轴平动', 'tz': '沿 Z 轴平动',
                'rx': '绕 X\' 轴转动 (夹角 β)', 'ry': '绕 Y\' 轴转动 (夹角 φ)', 'rz': '绕 Z\' 轴转动 (夹角 α)'
            };
            document.getElementById('current-action-label').innerText = "当前：" + labels[animType];
        }

        window.stopAnimation = function() {
            currentAnimation = 'none';
            animationTime = 0;
            
            const activeMol = molecules[currentMoleculeType];
            const startPos = new THREE.Vector3(2, 2, 2);
            activeMol.position.copy(startPos);
            activeMol.rotation.set(0, 0, 0);
            localAxesGroup.position.copy(startPos);

            ['tx', 'ty', 'tz', 'rx', 'ry', 'rz'].forEach(type => {
                const btn = document.getElementById('btn-' + type);
                if(btn) btn.classList.remove('btn-active');
            });
            
            hideDynamicArc();

            // 【功能加强】彻底还原为最完美的初始摄像机视角
            camera.position.set(9, 9, 7);
            controls.target.set(1.5, 1.5, 1.5);
            controls.update();

            document.getElementById('current-action-label').innerText = "当前：静止";
        }

        function updateUIState() {
            const rxBtn = document.getElementById('btn-rx');
            const ryBtn = document.getElementById('btn-ry');
            const rzBtn = document.getElementById('btn-rz');
            const infoTrans = document.getElementById('info-trans');
            const infoRot = document.getElementById('info-rot');
            const infoTotal = document.getElementById('info-total');

            [rxBtn, ryBtn, rzBtn].forEach(btn => { btn.disabled = true; btn.classList.add('btn-disabled'); });

            if (currentMoleculeType === 'mono') {
                infoTrans.innerHTML = '平动自由度 <span class="font-mono text-red-600">x, y, z</span> (3)';
                infoRot.innerHTML = '转动自由度 无 (0)';
                infoTotal.innerText = '总自由度 i = 3';
            } 
            else if (currentMoleculeType === 'dia') {
                infoTrans.innerHTML = '平动自由度 <span class="font-mono text-red-600">x, y, z</span> (3)';
                infoRot.innerHTML = '转动自由度 <span class="font-mono text-blue-600">α, β</span> (2)';
                infoTotal.innerText = '总自由度 i = 5';
                rxBtn.disabled = false; rxBtn.classList.remove('btn-disabled');
                rzBtn.disabled = false; rzBtn.classList.remove('btn-disabled');
            } 
            else if (currentMoleculeType === 'poly') {
                infoTrans.innerHTML = '平动自由度 <span class="font-mono text-red-600">x, y, z</span> (3)';
                infoRot.innerHTML = '转动自由度 <span class="font-mono text-blue-600">α, β, φ</span> (3)';
                infoTotal.innerText = '总自由度 i = 6';
                rxBtn.disabled = false; rxBtn.classList.remove('btn-disabled');
                ryBtn.disabled = false; ryBtn.classList.remove('btn-disabled');
                rzBtn.disabled = false; rzBtn.classList.remove('btn-disabled');
            }
        }

        window.downloadHTML = function() {
            // 【关键修复】克隆当前网页，并在克隆体中强行删除由 Three.js 动态生成的 canvas 标签
            const htmlNode = document.documentElement.cloneNode(true);
            const canvasInClone = htmlNode.querySelector('#canvas-container canvas');
            if (canvasInClone) {
                canvasInClone.remove();
            }
            
            // 将纯净的 HTML 转换为字符串供下载
            const htmlContent = "<!DOCTYPE html>\n" + htmlNode.outerHTML;
            
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = '常见分子类型的自由度演示_完美版.html'; 
            document.body.appendChild(a);
            a.click();
            
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        window.onload = init;
    </script>

</body></html>
