        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #444;
            border-radius: 2px;
        }

        input[type=range]:focus {
            outline: none;
        }

        .legend {
            margin-top: 10px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            font-size: 0.85rem;
            color: #bbb;
            line-height: 1.5;
        }

        .color-bar-container {
            margin-top: 10px;
        }
        
        .color-bar {
            height: 8px;
            width: 100%;
            background: linear-gradient(to right, hsl(240, 100%, 60%), hsl(120, 100%, 50%), hsl(60, 100%, 50%), hsl(0, 100%, 50%));
            border-radius: 4px;
            margin-top: 5px;
        }
        .color-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            margin-top: 4px;
            color: #888;
        }

        .download-btn {
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .download-btn:hover {
            background-color: #0097a7;
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .record-btn {
            background-color: #ff5722;
            color: white;
        }

        .record-btn:hover {
            background-color: #e64a19;
        }

        .record-btn:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="canvas-container">
            <canvas id="simCanvas" width="731" height="731"></canvas>
        </div>
        
        <div class="controls-panel">
            <h1>气体分子热运动</h1>
            
            <div class="control-group">
                <div class="control-header">
                    <span>系统温度 (设定)</span>
                    <div class="input-group">
                        <input type="number" id="tempInput" class="value-input" min="50" max="1000" step="10" value="298">
                        <span style="font-size: 0.85rem; color: #aaa;">K</span>
                    </div>
                </div>
                <input type="range" id="tempSlider" min="50" max="1000" step="10" value="298">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <span>实时实测温度 (动能守恒)</span>
                    <span id="realTempValue" class="value-badge" style="background: rgba(76, 175, 80, 0.15); color: #4caf50;">300.0 K</span>
                </div>
            </div>

            <div class="control-group">
                <div class="control-header">
                    <span>分子数量</span>
                    <div class="input-group">
                        <input type="number" id="countInput" class="value-input" min="10" max="500" step="10" value="150">
                        <span style="font-size: 0.85rem; color: #aaa;">个</span>
                    </div>
                </div>
                <input type="range" id="countSlider" min="10" max="500" step="10" value="150">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <span>分子半径</span>
                    <div class="input-group">
                        <input type="number" id="sizeInput" class="value-input" min="2" max="15" step="1" value="5">
                        <span style="font-size: 0.85rem; color: #aaa;">px</span>
                    </div>
                </div>
                <input type="range" id="sizeSlider" min="2" max="15" step="1" value="5">
            </div>

            <div class="color-bar-container">
                <div class="control-header" style="font-size: 0.85rem; color: #aaa;">分子速度指示</div>
                <div class="color-bar"></div>
                <div class="color-labels">
                    <span>慢 (冷)</span>
                    <span>快 (热)</span>
                </div>
            </div>

            <div class="legend">
                • 模拟同种理想气体分子(硬球模型)<br>
                • 严格执行完全弹性碰撞 (e=1)<br>
                • 实时监控能量守恒 (温度即动能)<br>
                • 颜色随分子即时速度动态变化
            </div>

            <div class="control-group" style="margin-top: 10px;">
                <div class="control-header">
                    <span>视频录制时长</span>
                    <div class="input-group">
                        <input type="number" id="recordDurationInput" class="value-input" min="1" max="300" step="1" value="60">
                        <span style="font-size: 0.85rem; color: #aaa;">秒</span>
                    </div>
                </div>
            </div>

            <div class="btn-group">
                <button id="recordBtn" class="download-btn record-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg> 开始录制视频</button>

                <button id="downloadBtn" class="download-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    保存本地 HTML
                </button>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // 处理高清屏适配的逻辑变量
    let logicalWidth = 0;
    let logicalHeight = 0;
    let dpr = 1;

    // 处理 Canvas 尺寸以适应高分屏，并启用抗锯齿高清渲染
    function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        // 获取设备的像素比，最高限制为3，防止性能过载
        dpr = Math.min(window.devicePixelRatio || 1, 3);
        
        logicalWidth = rect.width;
        logicalHeight = rect.height;
        
        // Canvas 的真实物理分辨率放大
        canvas.width = logicalWidth * dpr;
        canvas.height = logicalHeight * dpr;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const tempSlider = document.getElementById('tempSlider');
    const countSlider = document.getElementById('countSlider');
    const sizeSlider = document.getElementById('sizeSlider');
    const tempInput = document.getElementById('tempInput');
    const countInput = document.getElementById('countInput');
    const sizeInput = document.getElementById('sizeInput');

    let particles = [];
    let currentTemp = parseFloat(tempSlider.value);
    let targetCount = parseInt(countSlider.value);
    let particleRadius = parseInt(sizeSlider.value);
    
    const videoRecorder = { active: false, mediaRecorder: null, chunks: [], duration: 60, startTime: 0, mimeType: '' };

    const baseTemp = 298; 
    const baseSpeed = 3;
    const baseRadius = 5;
    
    const baseMass = baseRadius * baseRadius;
    const baseEk = 0.5 * baseMass * baseSpeed * baseSpeed;
    const energyToTempFactor = baseTemp / baseEk;

    class Particle {
        constructor(x, y, radius) {
            this.x = x;
            this.y = y;
            this.radius = radius;
            this.mass = radius * radius;
            
            const targetEk = currentTemp / energyToTempFactor;
            const speed = Math.sqrt((2 * targetEk) / this.mass); 
            const angle = Math.random() * Math.PI * 2;
            
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
        }

        getColor() {
            const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
            const maxExpectedSpeed = baseSpeed * Math.sqrt(1000 / baseTemp) * 1.5;
            let hue = 240 - (speed / maxExpectedSpeed) * 240;
            hue = Math.max(0, Math.min(240, hue));
            return `hsl(${hue}, 100%, 60%)`;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.getColor();
            ctx.fill();
            ctx.beginPath();
            ctx.arc(this.x - this.radius*0.3, this.y - this.radius*0.3, this.radius*0.3, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
            ctx.fill();
        }
    }

    function resolveCollision(p1, p2) {
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const distSq = dx * dx + dy * dy;
        const minDist = p1.radius + p2.radius;

        if (distSq >= minDist * minDist) return;
        if (distSq === 0) {
            p1.x += 0.01;
            return;
        }

        const distance = Math.sqrt(distSq);
        const nx = dx / distance;
        const ny = dy / distance;

        const overlap = minDist - distance;
        const cx = (overlap / 2) * nx;
        const cy = (overlap / 2) * ny;
        
        p1.x -= cx;
        p1.y -= cy;
        p2.x += cx;
        p2.y += cy;

        const dvx = p1.vx - p2.vx;
        const dvy = p1.vy - p2.vy;
        const velAlongNormal = dvx * nx + dvy * ny;

        if (velAlongNormal > 0) {
            p1.vx -= velAlongNormal * nx;
            p1.vy -= velAlongNormal * ny;
            p2.vx += velAlongNormal * nx;
            p2.vy += velAlongNormal * ny;
        }
    }

    function syncParticles() {
        while (particles.length < targetCount) {
            let x, y;
            let overlap = true;
            let attempts = 0;
            while (overlap && attempts < 100) {
                // 使用逻辑宽高度进行生成范围计算
                x = Math.random() * (logicalWidth - particleRadius * 2) + particleRadius;
                y = Math.random() * (logicalHeight - particleRadius * 2) + particleRadius;
                overlap = false;
                for (let p of particles) {
                    const dx = x - p.x;
                    const dy = y - p.y;
                    if (dx*dx + dy*dy < (particleRadius * 2.1) * (particleRadius * 2.1)) {
                        overlap = true;
                        break;
                    }
                }
                attempts++;
            }
            particles.push(new Particle(x, y, particleRadius));
        }
        
        if (particles.length > targetCount) {
            particles.splice(targetCount);
        }
    }

    function animate() {
        // --- 物理更新步 ---
        const SUBSTEPS = 5; 
        
        for (let step = 0; step < SUBSTEPS; step++) {
            particles.forEach(p => {
                p.x += p.vx / SUBSTEPS;
                p.y += p.vy / SUBSTEPS;
            });

            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    resolveCollision(particles[i], particles[j]);
                }
            }

            // 使用逻辑宽高度作为物理碰撞的墙壁边界
            particles.forEach(p => {
                if (p.x < p.radius) {
                    p.x = p.radius;
                    if (p.vx < 0) p.vx *= -1; 
                } else if (p.x > logicalWidth - p.radius) {
                    p.x = logicalWidth - p.radius;
                    if (p.vx > 0) p.vx *= -1;
                }

                if (p.y < p.radius) {
                    p.y = p.radius;
                    if (p.vy < 0) p.vy *= -1;
                } else if (p.y > logicalHeight - p.radius) {
                    p.y = logicalHeight - p.radius;
                    if (p.vy > 0) p.vy *= -1;
                }
            });
        }

        // --- 渲染步 ---
        // 重置矩阵
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        
        // 1. 填充外层背景（与网页背景色一致，遮盖角落圆角外区域）
        ctx.fillStyle = '#121212';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 缩放到高清分辨率
        ctx.scale(dpr, dpr);

        // 创建内部带圆角的路径轮廓
        const borderRadius = 12;
        ctx.beginPath();
        if (ctx.roundRect) {
            ctx.roundRect(1, 1, logicalWidth - 2, logicalHeight - 2, borderRadius);
        } else {
            ctx.rect(1, 1, logicalWidth - 2, logicalHeight - 2);
        }

        // 2. 填充圆角画布黑色背景
        ctx.fillStyle = '#000000';
        ctx.fill();

        // 3. 开启裁剪，防止分子在角落处画出圆角界限
        ctx.save();
        ctx.clip();

        let totalKineticEnergy = 0;
        particles.forEach(p => {
            p.draw();
            totalKineticEnergy += 0.5 * p.mass * (p.vx * p.vx + p.vy * p.vy);
        });

        // 结束裁剪
        ctx.restore();

        // 4. 将灰色边框画在最上方（使其能够被包含在录制出的视频里）
        ctx.strokeStyle = '#333333';
        ctx.lineWidth = 2;
        ctx.stroke();

        // --- 温度与 UI 计算 ---
        if (particles.length > 0) {
            const avgKineticEnergy = totalKineticEnergy / particles.length;
            const realTemp = avgKineticEnergy * energyToTempFactor;
            document.getElementById('realTempValue').innerText = realTemp.toFixed(1) + ' K';
        }

        if (videoRecorder.active) {
            const now = performance.now();
            const elapsed = Math.floor((now - videoRecorder.startTime) / 1000);
            const btn = document.getElementById('recordBtn');
            
            if (elapsed <= videoRecorder.duration) {
                btn.innerText = `录制中: ${elapsed}s / ${videoRecorder.duration}s`;
            }

            if (elapsed >= videoRecorder.duration && videoRecorder.mediaRecorder && videoRecorder.mediaRecorder.state === "recording") {
                videoRecorder.mediaRecorder.stop();
                videoRecorder.active = false;
                btn.innerText = '正在保存视频...';
            }
        }

        requestAnimationFrame(animate);
    }

    function updateTemperature(val) {
        let newTemp = parseFloat(val);
        if (isNaN(newTemp)) return;
        
        if (newTemp < 50) newTemp = 50;
        if (newTemp > 1000) newTemp = 1000;

        tempSlider.value = newTemp;
        tempInput.value = newTemp;
        
        let currentRealTemp = parseFloat(document.getElementById('realTempValue').innerText);
        if (isNaN(currentRealTemp) || currentRealTemp <= 0) currentRealTemp = currentTemp;
        
        const scale = Math.sqrt(newTemp / currentRealTemp);
        
        particles.forEach(p => {
            p.vx *= scale;
            p.vy *= scale;
        });
        
        currentTemp = newTemp;
    }

    function updateCount(val) {
        let newCount = parseInt(val);
        if (isNaN(newCount)) return;
        
        if (newCount < 10) newCount = 10;
        if (newCount > 500) newCount = 500;

        countSlider.value = newCount;
        countInput.value = newCount;
        targetCount = newCount;
        syncParticles();
    }

    function updateSize(val) {
        let newRadius = parseInt(val);
        if (isNaN(newRadius)) return;
        
        if (newRadius < 2) newRadius = 2;
        if (newRadius > 15) newRadius = 15;

        const newMass = newRadius * newRadius;
        const oldMass = particleRadius * particleRadius;
        
        const speedScale = Math.sqrt(oldMass / newMass);
        
        sizeSlider.value = newRadius;
        sizeInput.value = newRadius;
        particleRadius = newRadius;

        particles.forEach(p => {
            p.radius = particleRadius;
            p.mass = newMass;
            p.vx *= speedScale;
            p.vy *= speedScale;
        });

        syncParticles();
    }

    tempSlider.addEventListener('input', (e) => updateTemperature(e.target.value));
    countSlider.addEventListener('input', (e) => updateCount(e.target.value));
    sizeSlider.addEventListener('input', (e) => updateSize(e.target.value));

    tempInput.addEventListener('change', (e) => updateTemperature(e.target.value));
    countInput.addEventListener('change', (e) => updateCount(e.target.value));
    sizeInput.addEventListener('change', (e) => updateSize(e.target.value));

    syncParticles();
    animate();

    document.getElementById('downloadBtn').addEventListener('click', () => {
        const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'gas_simulation.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });

    document.getElementById('recordBtn').addEventListener('click', () => {
        if (videoRecorder.active) return;
        const btn = document.getElementById('recordBtn');
        btn.disabled = true;

        let duration = parseInt(document.getElementById('recordDurationInput').value);
        if (isNaN(duration) || duration < 1) {
            duration = 60;
            document.getElementById('recordDurationInput').value = 60;
        }

        videoRecorder.duration = duration;
        videoRecorder.chunks = [];

        try {
            // 以 30FPS 捕获高分辨率的 Canvas
            const stream = canvas.captureStream(30);
            
            // 设定为 8Mbps 超高码率防止视频出现马赛克（压缩伪影）
            let options = { mimeType: 'video/mp4', videoBitsPerSecond: 8000000 };
            if (!MediaRecorder.isTypeSupported('video/mp4')) {
                options = { mimeType: 'video/webm; codecs=vp9', videoBitsPerSecond: 8000000 };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'video/webm', videoBitsPerSecond: 8000000 };
                }
            }
            videoRecorder.mimeType = options.mimeType;

            videoRecorder.mediaRecorder = new MediaRecorder(stream, options);

            videoRecorder.mediaRecorder.ondataavailable = function(e) {
                if (e.data.size > 0) {
                    videoRecorder.chunks.push(e.data);
                }
            };

            videoRecorder.mediaRecorder.onstop = function() {
                const ext = videoRecorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
                const blob = new Blob(videoRecorder.chunks, { type: videoRecorder.mimeType });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `gas_simulation_${duration}s.${ext}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg> 开始录制视频';
                btn.disabled = false;
            };

            videoRecorder.mediaRecorder.start();
            videoRecorder.startTime = performance.now();
            videoRecorder.active = true;
            btn.innerText = `录制中: 0s / ${duration}s`;

        } catch (err) {
            console.error('视频录制失败:', err);
            alert('您的浏览器可能不支持直接录制视频。');
            btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg> 开始录制视频';
            btn.disabled = false;
            videoRecorder.active = false;
        }
    });

</script>
