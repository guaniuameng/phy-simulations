<body class="bg-slate-50 min-h-screen p-3 md:p-5 font-sans overflow-x-hidden">

    <div class="max-w-[1400px] mx-auto flex flex-col h-full">
        <!-- 页面标题 -->
        <header class="mb-4 text-center">
            <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 mb-2 tracking-tight">热力学四大过程演示仪</h1>
            <div class="flex flex-wrap justify-center gap-2 text-xs font-medium text-slate-600">
                <span class="px-3 py-1 bg-white rounded-full shadow-sm border border-slate-200">等压 (Isobaric)</span>
                <span class="px-3 py-1 bg-white rounded-full shadow-sm border border-slate-200">等容 (Isochoric)</span>
                <span class="px-3 py-1 bg-white rounded-full shadow-sm border border-slate-200">等温 (Isothermal)</span>
                <span class="px-3 py-1 bg-white rounded-full shadow-sm border border-slate-200">绝热 (Adiabatic)</span>
            </div>
        </header>

        <!-- 主体网格：采用 3:5:4 的比例分为三栏，确保一屏展示 -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-stretch flex-1">
            
            <!-- 【左栏】：控制台与数据 (占比 3/12) -->
            <div class="lg:col-span-3 flex flex-col gap-4">
                
                <!-- 实时状态仪 (深色风格) -->
                <div class="bg-slate-800 p-4 rounded-xl shadow-md flex flex-col justify-center relative overflow-hidden">
                    <div class="absolute -right-8 -top-8 w-32 h-32 bg-slate-700 rounded-full opacity-50 blur-2xl"></div>
                    
                    <h2 class="text-slate-400 text-xs font-bold mb-3 uppercase tracking-widest flex items-center gap-1 z-10">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
                        实时数据
                    </h2>
                    
                    <div class="grid grid-cols-2 gap-2 z-10">
                        <div class="bg-slate-700/50 p-2.5 rounded-lg border border-slate-600/50">
                            <div class="text-[11px] text-blue-300 mb-0.5">体积 (V)</div>
                            <div class="text-lg font-mono text-blue-100 font-semibold"><span id="valV">0.100</span><span class="text-xs font-sans ml-1">m³</span></div>
                        </div>
                        <div class="bg-slate-700/50 p-2.5 rounded-lg border border-slate-600/50">
                            <div class="text-[11px] text-red-300 mb-0.5">温度 (T)</div>
                            <div class="text-lg font-mono text-red-100 font-semibold"><span id="valT">300.0</span><span class="text-xs font-sans ml-1">K</span></div>
                        </div>
                        <div class="bg-slate-700/50 p-3 rounded-lg border border-slate-600/50 col-span-2 flex justify-between items-end shadow-inner">
                            <div>
                                <div class="text-[11px] text-green-300 mb-0.5">压强 (P)</div>
                                <div class="text-2xl font-mono text-green-400 font-bold tracking-tight"><span id="valP">100,000</span><span class="text-sm font-sans font-normal ml-1">Pa</span></div>
                            </div>
                            <div class="text-slate-500 pb-0.5">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 过程控制面板 -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex-1 flex flex-col">
                    <h2 class="text-base font-bold text-slate-700 mb-3 flex items-center gap-2 border-b border-slate-100 pb-2">
                        <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                        过程控制
                    </h2>
                    <div class="flex flex-col gap-2 flex-1 justify-center">
                        <button onclick="startProcess('isobaric')" id="btn-isobaric" class="btn-process py-2.5 px-3 bg-slate-50 hover:bg-blue-50 text-slate-700 text-sm font-bold rounded-lg transition duration-200 text-left border border-slate-200">
                            1. 等压过程 (P恒定)
                        </button>
                        <button onclick="startProcess('isochoric')" id="btn-isochoric" class="btn-process py-2.5 px-3 bg-slate-50 hover:bg-blue-50 text-slate-700 text-sm font-bold rounded-lg transition duration-200 text-left border border-slate-200">
                            2. 等容过程 (V恒定)
                        </button>
                        <button onclick="startProcess('isothermal')" id="btn-isothermal" class="btn-process py-2.5 px-3 bg-slate-50 hover:bg-blue-50 text-slate-700 text-sm font-bold rounded-lg transition duration-200 text-left border border-slate-200">
                            3. 等温过程 (T恒定)
                        </button>
                        <button onclick="startProcess('adiabatic')" id="btn-adiabatic" class="btn-process py-2.5 px-3 bg-slate-50 hover:bg-blue-50 text-slate-700 text-sm font-bold rounded-lg transition duration-200 text-left border border-slate-200">
                            4. 绝热过程 (Q=0)
                        </button>
                        
                        <div class="grid grid-cols-2 gap-2 mt-1">
                            <button onclick="resetState()" class="py-2 px-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold rounded-lg transition duration-200 text-center flex items-center justify-center gap-1">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                重置
                            </button>
                            <button onclick="downloadHTML()" class="py-2 px-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg transition duration-200 flex items-center justify-center gap-1 shadow-sm">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                保存演示
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 【中栏】：主要气缸画布区 (占比 5/12) -->
            <div class="lg:col-span-5 bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center">
                <div class="w-full flex items-center justify-between mb-3">
                    <h2 class="text-base font-bold text-slate-700 flex items-center gap-2">
                        <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                        气缸动态演示
                    </h2>
                    <span class="flex h-2.5 w-2.5 relative">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-blue-500"></span>
                    </span>
                </div>
                <!-- 中间的汽缸画布，调整到非常适合屏幕纵向展示的高度 -->
                <div class="w-full flex-1 flex justify-center items-center bg-slate-50/50 rounded-lg overflow-hidden border border-slate-100">
                    <canvas id="simCanvas" width="440" height="520" class="w-full max-w-[440px] h-auto"></canvas>
                </div>
            </div>

            <!-- 【右栏】：PV 图与教学解析 (占比 4/12) -->
            <div class="lg:col-span-4 flex flex-col gap-4">
                
                <!-- P-V 图 (变小) -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center">
                    <h2 class="text-base font-bold text-slate-700 mb-2 self-start flex items-center gap-2">
                        <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                        P-V 状态图
                    </h2>
                    <div class="w-full flex justify-center items-center">
                        <canvas id="graphCanvas" width="380" height="240" class="w-full max-w-[380px] h-auto"></canvas>
                    </div>
                </div>

                <!-- 教学解析放在 P-V 图下方，自适应剩余高度 -->
                <div class="bg-gradient-to-br from-indigo-50 to-blue-50/50 p-5 rounded-xl shadow-sm border border-indigo-100 flex-1 relative overflow-hidden flex flex-col">
                    <svg class="absolute -bottom-6 -right-6 w-32 h-32 text-indigo-200/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    <h3 class="font-bold text-indigo-900 mb-3 flex items-center gap-2 relative z-10 border-b border-indigo-200/50 pb-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        教学解析
                    </h3>
                    <div id="descText" class="text-indigo-900/80 text-sm leading-relaxed relative z-10 overflow-y-auto flex-1"><b>欢迎使用热力学演示器！</b><br><br>系统将从标准状态<br> (V=0.10 m³, T=300 K, P=100kPa) <br>开始演示。<br><br>您可以结合中间的微观动画和上方的 P-V 图，直观观察各状态参量之间的变化规律。</div>
                </div>
            </div>

        </div>
    </div>

<script>
    // ----------------------------------------------------
    // 核心物理状态与变量
    // ----------------------------------------------------
    let mode = 'idle'; 
    let t = 0;         
    let dir = 1;       
    
    // 当前状态基准 (V: 立方米 m³, T: 开尔文 K, P: 帕斯卡 Pa)
    const BASE_STATE = { V: 0.10, T: 300, P: 100000 };
    let state = { ...BASE_STATE }; 
    const nR = (BASE_STATE.P * BASE_STATE.V) / BASE_STATE.T;

    const descriptions = {
        idle: "<b>欢迎使用热力学演示器！</b><br><br>系统将从标准状态<br> (V=0.10 m³, T=300 K, P=100kPa) <br>开始演示。<br><br>您可以结合中间的微观动画和上方的 P-V 图，直观观察各状态参量之间的变化规律。",
        
        isobaric: "<b>【等压过程 Isobaric】</b><br><br>" +
                  "• <b>核心</b>：压强 (P) 恒定不变。<br>" +
                  "• <b>规律</b>：<b>V / T = 常量</b>。升温必膨胀。<br>" +
                  "• <b>观察</b>：活塞配重块数量不变；加热时气体变红升温，同时活塞上升膨胀对外做功。",
                  
        isochoric: "<b>【等容过程 Isochoric】</b><br><br>" +
                   "• <b>核心</b>：体积 (V) 恒定不变。<br>" +
                   "• <b>规律</b>：<b>P / T = 常量</b>。升温必增压。<br>" +
                   "• <b>观察</b>：活塞被红色销钉锁定；加热时，大量分子高频剧烈撞击器壁导致压强 (P) 飙升，但不对外做功。",
                   
        isothermal: "<b>【等温过程 Isothermal】</b><br><br>" +
                    "• <b>核心</b>：温度 (T) 恒定不变。<br>" +
                    "• <b>规律</b>：<b>P × V = 常量</b>。膨胀必降压。<br>" +
                    "• <b>观察</b>：移走配重块让气体膨胀；为保持颜色不泛蓝（内能不减），气缸底部必须持续吸热补充做功消耗；P-V 图呈双曲线。",
                    
        adiabatic: "<b>【绝热过程 Adiabatic】</b><br><br>" +
                   "• <b>核心</b>：与外界<b>无热量交换</b> (Q = 0)。<br>" +
                   "• <b>规律</b>：<b>P × V<sup>γ</sup> = 常量</b>。<br>" +
                   "• <b>观察</b>：包裹绝热层；气体膨胀对外做功只能“消耗老本(内能)”，导致温度 (T) 迅速下降，气体变蓝。"
    };

    // ----------------------------------------------------
    // 画布初始化与气缸参数配置
    // ----------------------------------------------------
    const canvasSim = document.getElementById('simCanvas');
    const ctxSim = canvasSim.getContext('2d');
    const canvasGraph = document.getElementById('graphCanvas');
    const ctxGraph = canvasGraph.getContext('2d');

    let particles = [];
    const NUM_PARTICLES = 200; 
    
    // 适配 440x520 画布的气缸参数
    const CYLINDER_X = 90;         
    const CYLINDER_W = 260;         
    const CYLINDER_BOTTOM = 460;    
    const WALL_TOP = 60;            

    // 高度比例尺：当 V=0.10 时，高度映射为 200 px (活塞位于 260)
    const VOLUME_SCALE = 2000; 

    function initParticles() {
        particles = [];
        const pistonY = CYLINDER_BOTTOM - state.V * VOLUME_SCALE;
        for (let i = 0; i < NUM_PARTICLES; i++) {
            particles.push({
                x: CYLINDER_X + 4 + Math.random() * (CYLINDER_W - 8),
                y: pistonY + 4 + Math.random() * (CYLINDER_BOTTOM - pistonY - 8),
                vx: (Math.random() - 0.5) * 2.5,
                vy: (Math.random() - 0.5) * 2.5
            });
        }
    }

    function getTempColor(T) {
        let hue = 240 - ((T - 150) / 450) * 240;
        hue = Math.max(0, Math.min(240, hue));
        return `hsla(${hue}, 85%, 65%, 0.5)`;
    }

    // ----------------------------------------------------
    // 控制逻辑
    // ----------------------------------------------------
    function startProcess(processType) {
        document.querySelectorAll('.btn-process').forEach(btn => {
            btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-600', 'shadow-md');
            btn.classList.add('bg-slate-50', 'text-slate-700', 'border-slate-200');
        });
        const activeBtn = document.getElementById(`btn-${processType}`);
        if(activeBtn) {
            activeBtn.classList.remove('bg-slate-50', 'text-slate-700', 'border-slate-200');
            activeBtn.classList.add('bg-blue-600', 'text-white', 'border-blue-600', 'shadow-md');
        }

        const descText = document.getElementById('descText');
        if(descText) descText.innerHTML = descriptions[processType];

        state = { ...BASE_STATE };
        t = 0;
        dir = 1;
        mode = processType;
        initParticles();
    }

    function resetState() {
        document.querySelectorAll('.btn-process').forEach(btn => {
            btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-600', 'shadow-md');
            btn.classList.add('bg-slate-50', 'text-slate-700', 'border-slate-200');
        });
        mode = 'idle';
        t = 0;
        state = { ...BASE_STATE };
        const descText = document.getElementById('descText');
        if(descText) descText.innerHTML = descriptions.idle;
        initParticles();
        updateUI();
    }

    function downloadHTML() {
        const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html' });
        const a = document.createElement('a');
        const url = URL.createObjectURL(blob);
        a.href = url;
        a.download = 'Thermodynamics_Animation.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // ----------------------------------------------------
    // 更新物理逻辑
    // ----------------------------------------------------
    function updatePhysics() {
        if (mode === 'idle') return;

        t += 0.003 * dir;
        if (t >= 1) { t = 1; dir = -1; }
        if (t <= 0) { t = 0; dir = 1; }

        switch (mode) {
            case 'isobaric':
                state.V = 0.10 + 0.05 * t;         
                state.P = BASE_STATE.P;         
                state.T = (state.P * state.V) / nR;    
                break;
            case 'isochoric':
                state.V = BASE_STATE.V;         
                state.T = 300 + 300 * t;        
                state.P = (nR * state.T) / state.V;    
                break;
            case 'isothermal':
                state.V = 0.10 + 0.05 * t;         
                state.T = BASE_STATE.T;         
                state.P = (nR * state.T) / state.V;    
                break;
            case 'adiabatic':
                const C = BASE_STATE.P * Math.pow(BASE_STATE.V, 1.4);
                state.V = 0.10 + 0.05 * t;                 
                state.P = C / Math.pow(state.V, 1.4);   
                state.T = (state.P * state.V) / nR;            
                break;
        }
    }

    function updateParticles() {
        const gasHeight = state.V * VOLUME_SCALE;
        const pistonY = CYLINDER_BOTTOM - gasHeight;
        const speedFactor = Math.sqrt(state.T / 300) * 1.5;

        particles.forEach(p => {
            p.x += p.vx * speedFactor;
            p.y += p.vy * speedFactor;

            const r = 3; 
            if (p.x <= CYLINDER_X + r) { p.x = CYLINDER_X + r; p.vx *= -1; }
            if (p.x >= CYLINDER_X + CYLINDER_W - r) { p.x = CYLINDER_X + CYLINDER_W - r; p.vx *= -1; }
            if (p.y >= CYLINDER_BOTTOM - r) { p.y = CYLINDER_BOTTOM - r; p.vy *= -1; }
            if (p.y <= pistonY + r) { p.y = pistonY + r; p.vy = Math.abs(p.vy); }
        });
    }

    function updateUI() {
        const valV = document.getElementById('valV');
        const valT = document.getElementById('valT');
        const valP = document.getElementById('valP');
        
        if (valV) valV.innerText = state.V.toFixed(3);
        if (valT) valT.innerText = state.T.toFixed(1);
        if (valP) valP.innerText = Math.round(state.P).toLocaleString();
    }

    // ----------------------------------------------------
    // 渲染仿真动画 (气缸)
    // ----------------------------------------------------
    function drawSim() {
        ctxSim.clearRect(0, 0, canvasSim.width, canvasSim.height);

        const gasHeight = state.V * VOLUME_SCALE;
        const pistonY = CYLINDER_BOTTOM - gasHeight;
        const pistonHeight = 20; 

        // 1. 绝热涂层
        if (mode === 'adiabatic') {
            ctxSim.fillStyle = '#e5e7eb';
            ctxSim.fillRect(CYLINDER_X - 16, WALL_TOP, CYLINDER_W + 32, CYLINDER_BOTTOM - WALL_TOP + 16);
            ctxSim.lineWidth = 4;
            ctxSim.strokeStyle = '#9ca3af';
            ctxSim.setLineDash([10, 6]);
            ctxSim.strokeRect(CYLINDER_X - 16, WALL_TOP, CYLINDER_W + 32, CYLINDER_BOTTOM - WALL_TOP + 16);
            ctxSim.setLineDash([]);
        }

        // 2. 气体内部
        ctxSim.fillStyle = getTempColor(state.T);
        ctxSim.fillRect(CYLINDER_X, pistonY, CYLINDER_W, gasHeight);

        // 3. 气缸外壳壁
        ctxSim.beginPath();
        ctxSim.moveTo(CYLINDER_X, WALL_TOP);
        ctxSim.lineTo(CYLINDER_X, CYLINDER_BOTTOM);
        ctxSim.lineTo(CYLINDER_X + CYLINDER_W, CYLINDER_BOTTOM);
        ctxSim.lineTo(CYLINDER_X + CYLINDER_W, WALL_TOP);
        ctxSim.lineWidth = 5;
        ctxSim.strokeStyle = '#334155';
        ctxSim.stroke();

        // 4. 分子
        ctxSim.fillStyle = '#0f172a';
        particles.forEach(p => {
            ctxSim.beginPath(); 
            ctxSim.arc(p.x, p.y, 3, 0, Math.PI * 2); 
            ctxSim.fill();
        });

        // 5. 活塞
        ctxSim.fillStyle = '#475569';
        ctxSim.fillRect(CYLINDER_X, pistonY - pistonHeight, CYLINDER_W, pistonHeight);
        ctxSim.fillStyle = '#94a3b8'; 
        ctxSim.fillRect(CYLINDER_X, pistonY - pistonHeight, CYLINDER_W, 4);

        // 6. 配重块
        let numWeights = 3; 
        if (mode === 'isothermal' || mode === 'adiabatic') {
            numWeights = state.P < 80000 ? 2 : (state.P < 60000 ? 1 : 3);
        }

        ctxSim.fillStyle = '#d97706'; 
        const wWidth = 50;   
        const wHeight = 16;  
        const wGap = 5;
        for (let i = 0; i < numWeights; i++) {
            let wx = CYLINDER_X + CYLINDER_W / 2 - wWidth / 2;
            let wy = pistonY - pistonHeight - (i + 1) * wHeight - i * wGap;
            ctxSim.fillRect(wx, wy, wWidth, wHeight);
            ctxSim.strokeStyle = '#92400e';
            ctxSim.lineWidth = 2;
            ctxSim.strokeRect(wx, wy, wWidth, wHeight);
        }

        // 7. 销钉
        if (mode === 'isochoric') {
            ctxSim.fillStyle = '#ef4444'; 
            const lockY = CYLINDER_BOTTOM - BASE_STATE.V * VOLUME_SCALE - pistonHeight;
            ctxSim.fillRect(CYLINDER_X - 12, lockY + 5, 24, 10);
            ctxSim.fillRect(CYLINDER_X + CYLINDER_W - 12, lockY + 5, 24, 10);
        }

        // 8. 状态符号
        ctxSim.font = "30px Arial"; 
        ctxSim.textAlign = "center";
        let isHeating = false; let isCooling = false;
        
        if (mode === 'isobaric' || mode === 'isochoric' || mode === 'isothermal') {
            if (dir === 1) isHeating = true; 
            if (dir === -1) isCooling = true;
        }

        if (isHeating) {
            ctxSim.fillText("🔥", CYLINDER_X + CYLINDER_W / 2 - 35, CYLINDER_BOTTOM + 38);
            ctxSim.fillText("🔥", CYLINDER_X + CYLINDER_W / 2 + 35, CYLINDER_BOTTOM + 38);
        } else if (isCooling) {
            ctxSim.fillText("❄️", CYLINDER_X + CYLINDER_W / 2 - 35, CYLINDER_BOTTOM + 38);
            ctxSim.fillText("❄️", CYLINDER_X + CYLINDER_W / 2 + 35, CYLINDER_BOTTOM + 38);
        }
    }

    // ----------------------------------------------------
    // 渲染 P-V 图像 (缩小版)
    // ----------------------------------------------------
    function drawGraph() {
        ctxGraph.clearRect(0, 0, canvasGraph.width, canvasGraph.height);

        const gLeft = 55;  
        const gRight = 360;
        const gTop = 15;
        const gBottom = 200; // 高度压缩到了 200
        
        const maxV = 0.17;     
        const maxP = 215000;   

        const mapX = (V) => gLeft + (V / maxV) * (gRight - gLeft);
        const mapY = (P) => gBottom - (P / maxP) * (gBottom - gTop);

        // 网格线
        ctxGraph.lineWidth = 1;
        ctxGraph.strokeStyle = '#e2e8f0';
        for (let i = 1; i <= 3; i++) { 
            let x = mapX(i * 0.05); 
            ctxGraph.beginPath(); ctxGraph.moveTo(x, gTop); ctxGraph.lineTo(x, gBottom); ctxGraph.stroke();
        }
        for (let i = 1; i <= 4; i++) { 
            let y = mapY(i * 50000); 
            ctxGraph.beginPath(); ctxGraph.moveTo(gLeft, y); ctxGraph.lineTo(gRight, y); ctxGraph.stroke();
        }

        // 主轴
        ctxGraph.strokeStyle = '#334155';
        ctxGraph.lineWidth = 2;
        ctxGraph.beginPath();
        ctxGraph.moveTo(gLeft, gTop); ctxGraph.lineTo(gLeft, gBottom); 
        ctxGraph.lineTo(gRight, gBottom); 
        ctxGraph.stroke();

        // Y轴箭头 (指向上)
        ctxGraph.beginPath();
        ctxGraph.moveTo(gLeft - 5, gTop + 8);
        ctxGraph.lineTo(gLeft, gTop);
        ctxGraph.lineTo(gLeft + 5, gTop + 8);
        ctxGraph.stroke();

        // X轴箭头 (指向右)
        ctxGraph.beginPath();
        ctxGraph.moveTo(gRight - 8, gBottom - 5);
        ctxGraph.lineTo(gRight, gBottom);
        ctxGraph.lineTo(gRight - 8, gBottom + 5);
        ctxGraph.stroke();

        // 标签文字
        ctxGraph.fillStyle = '#64748b';
        ctxGraph.font = "11px sans-serif";
        ctxGraph.fillText("V (m³)", gRight - 15, gBottom + 20);
        ctxGraph.fillText("P (Pa)", gLeft - 40, gTop + 8);
        
        ctxGraph.fillText("0.10", mapX(0.10) - 12, gBottom + 16);
        ctxGraph.fillText("0.15", mapX(0.15) - 12, gBottom + 16);
        ctxGraph.fillText("100k", gLeft - 32, mapY(100000) + 4);
        ctxGraph.fillText("200k", gLeft - 32, mapY(200000) + 4);

        if (mode !== 'idle') {
            ctxGraph.beginPath();
            ctxGraph.strokeStyle = '#94a3b8';
            ctxGraph.lineWidth = 2;
            ctxGraph.setLineDash([4, 4]);
            
            for (let simT = 0; simT <= 1; simT += 0.05) {
                let tempV, tempP;
                if (mode === 'isobaric') {
                    tempV = 0.10 + 0.05 * simT; tempP = BASE_STATE.P;
                } else if (mode === 'isochoric') {
                    tempV = BASE_STATE.V; let tempTemp = 300 + 300 * simT; tempP = (nR * tempTemp) / tempV;
                } else if (mode === 'isothermal') {
                    tempV = 0.10 + 0.05 * simT; tempP = (nR * BASE_STATE.T) / tempV;
                } else if (mode === 'adiabatic') {
                    tempV = 0.10 + 0.05 * simT; tempP = (BASE_STATE.P * Math.pow(BASE_STATE.V, 1.4)) / Math.pow(tempV, 1.4);
                }
                
                if (simT === 0) ctxGraph.moveTo(mapX(tempV), mapY(tempP));
                else ctxGraph.lineTo(mapX(tempV), mapY(tempP));
            }
            ctxGraph.stroke();
            ctxGraph.setLineDash([]);
        }

        // 绘制当前点
        const cx = mapX(state.V);
        const cy = mapY(state.P);
        
        ctxGraph.beginPath();
        ctxGraph.arc(cx, cy, 5, 0, Math.PI * 2);
        ctxGraph.fillStyle = '#ef4444';
        ctxGraph.fill();
        ctxGraph.strokeStyle = '#b91c1c';
        ctxGraph.lineWidth = 2;
        ctxGraph.stroke();

        // 绘制参考原点
        ctxGraph.beginPath();
        ctxGraph.arc(mapX(BASE_STATE.V), mapY(BASE_STATE.P), 3, 0, Math.PI * 2);
        ctxGraph.fillStyle = '#3b82f6';
        ctxGraph.fill();
    }

    // ----------------------------------------------------
    // 主循环
    // ----------------------------------------------------
    function loop() {
        updatePhysics();
        updateParticles();
        drawSim();
        drawGraph();
        updateUI();
        requestAnimationFrame(loop);
    }

    resetState();
    loop();

</script>
