<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热力学功（过程量）演示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
        }
        
        /* 气缸样式 */
        .cylinder-container {
            position: relative;
            width: 100%;
            height: 200px;
            background: repeating-linear-gradient(
                45deg,
                #cbd5e1,
                #cbd5e1 10px,
                #e2e8f0 10px,
                #e2e8f0 20px
            );
            border: 4px solid #475569;
            border-right: none;
            display: flex;
            align-items: center;
        }
        
        .cylinder-inner {
            position: absolute;
            left: 0;
            top: 4px;
            bottom: 4px;
            background-color: #fff;
            width: 90%;
            border-right: 2px dashed #94a3b8;
        }

        .gas-volume {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background-color: rgba(56, 189, 248, 0.2);
            transition: background-color 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .gas-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, #0ea5e9 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.5;
        }

        .piston {
            position: absolute;
            top: 0;
            height: 100%;
            width: 30px;
            background: linear-gradient(to right, #64748b, #94a3b8, #64748b);
            border: 2px solid #334155;
            z-index: 10;
        }

        .piston-rod {
            position: absolute;
            top: 50%;
            left: 30px;
            transform: translateY(-50%);
            width: 150px;
            height: 12px;
            background-color: #cbd5e1;
            border: 2px solid #64748b;
            z-index: 9;
        }

        /* 模拟 Office 公式编辑器 (Cambria Math) 的样式 */
        .math-text {
            font-family: "Cambria Math", "Latin Modern Math", "Times New Roman", Times, serif;
            font-style: italic;
        }
        
        .math-operator {
            font-family: "Cambria Math", "Latin Modern Math", "Times New Roman", Times, serif;
            font-style: normal;
        }

        /* 公式样式 */
        .formula-box {
            background: linear-gradient(to right, #fef08a, #fed7aa);
            border: 1px solid #fdba74;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="p-6">

    <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <!-- Header -->
        <div class="bg-slate-800 text-white p-6 text-center">
            <h1 class="text-3xl font-bold tracking-wider">功（过程量）</h1>
            <p class="mt-2 text-slate-300">功是能量传递和转换的量度，它引起系统热运动状态的变化。</p>
        </div>

        <div class="p-8 grid grid-cols-1 lg:grid-cols-2 gap-12">
            
            <!-- Left Panel: Physical Model & Controls -->
            <div class="flex flex-col gap-8">
                
                <!-- Controls -->
                <div class="bg-slate-50 p-6 rounded-xl border border-slate-200">
                    <h3 class="text-lg font-semibold mb-4 text-slate-700">1. 控制面板</h3>
                    
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-slate-700 mb-2">选择膨胀路径 (从状态a 到 状态b):</label>
                        <div class="flex flex-col gap-3">
                            <label class="inline-flex items-start cursor-pointer group">
                                <input type="radio" name="path" value="1" class="form-radio text-red-500 w-5 h-5 mt-1" checked>
                                <div class="ml-3">
                                    <span class="block text-slate-800 font-medium group-hover:text-red-600 transition-colors">路径 C (下凹曲线)</span>
                                    <span class="block text-xs text-slate-500 mt-1">可能原因：例如接近**绝热膨胀**，系统不吸热，依靠消耗自身内能做功，导致压强下降较快。</span>
                                </div>
                            </label>
                            <label class="inline-flex items-start cursor-pointer group">
                                <input type="radio" name="path" value="2" class="form-radio text-teal-500 w-5 h-5 mt-1">
                                <div class="ml-3">
                                    <span class="block text-slate-800 font-medium group-hover:text-teal-600 transition-colors">路径 D (上凸曲线)</span>
                                    <span class="block text-xs text-slate-500 mt-1">可能原因：例如膨胀过程中**持续从外界吸收大量热量**，使得压强在体积增加初期没有显著下降，甚至短暂维持较高压强。</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <div class="mt-6">
                        <label class="block text-sm font-medium text-slate-700 mb-2">膨胀进度 (体积 <span class="math-text">V</span>):</label>
                        <input type="range" id="progressSlider" min="0" max="1" step="0.01" value="0" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                        <div class="flex justify-between text-xs text-slate-500 mt-1">
                            <span>状态 a (<span class="math-text">V<sub>a</sub></span>)</span>
                            <span>状态 b (<span class="math-text">V<sub>b</sub></span>)</span>
                        </div>
                    </div>
                </div>

                <!-- Cylinder Animation -->
                <div>
                    <h3 class="text-lg font-semibold mb-4 text-slate-700">2. 气缸活塞模型</h3>
                    <div class="cylinder-container rounded-l-lg mt-4">
                        <div class="cylinder-inner rounded-l-md">
                            <!-- Gas -->
                            <div id="gas-volume" class="gas-volume rounded-l-sm" style="width: 20%;">
                                <div class="gas-particles"></div>
                                <div class="relative z-10 text-center font-bold text-slate-800 bg-white/70 px-2 py-1 rounded">
                                    气体压强 <span class="math-text text-xl">p</span><br>
                                    <span id="pressure-val" class="text-sm font-normal">--</span>
                                </div>
                            </div>
                            
                            <!-- Piston -->
                            <div id="piston" class="piston" style="left: 20%;">
                                <div class="piston-rod"></div>
                            </div>
                            
                            <!-- Indicators -->
                            <div id="dl-indicator" class="absolute bottom-[-35px] left-[20%] text-center text-sm font-bold text-slate-600 hidden">
                                <span>&larr;</span> <span class="math-operator">d</span><span class="math-text">l</span> <span>&rarr;</span>
                            </div>
                        </div>
                    </div>
                    <div class="mt-8 flex justify-center text-slate-600 text-sm">
                        <span class="mr-8">活塞面积: <span class="math-text text-lg font-bold">S</span></span>
                        <span>微小体积变化: <span class="math-operator font-bold">d</span><span class="math-text font-bold">V</span> = <span class="math-text font-bold">S</span>&nbsp;<span class="math-operator font-bold">d</span><span class="math-text font-bold">l</span></span>
                    </div>
                </div>

            </div>

            <!-- Right Panel: P-V Diagram & Formulas -->
            <div class="flex flex-col gap-6">
                
                <!-- P-V Canvas -->
                <div>
                    <h3 class="text-lg font-semibold mb-2 text-slate-700">3. <span class="math-text">p-V</span> 状态图与做功面积</h3>
                    <div class="relative w-full border-2 border-slate-200 rounded-lg bg-white overflow-hidden" style="aspect-ratio: 4/3;">
                        <canvas id="pvCanvas" class="absolute top-0 left-0 w-full h-full"></canvas>
                    </div>
                </div>

                <!-- Calculations & Results -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col justify-center items-center">
                        <div class="text-sm text-slate-500 mb-2">微元功公式</div>
                        <div class="text-xl font-bold text-slate-800">
                            <span class="math-operator">d</span><span class="math-text">W</span> = <span class="math-text">F</span> <span class="math-operator">d</span><span class="math-text">l</span> = <span class="math-text">pS</span> <span class="math-operator">d</span><span class="math-text">l</span><br>
                            <span class="text-purple-600 mt-1 inline-block"><span class="math-operator">d</span><span class="math-text">W</span> = <span class="math-text">p</span> <span class="math-operator">d</span><span class="math-text">V</span></span>
                        </div>
                    </div>
                    
                    <div class="formula-box p-4 rounded-xl flex flex-col justify-center items-center">
                        <div class="text-sm text-amber-800 mb-2">总功计算 (准静态过程)</div>
                        <div class="text-2xl font-bold text-slate-800 flex items-center">
                            <span class="math-text">W</span> &nbsp;=&nbsp; <span class="math-operator text-3xl font-light">&int;</span> <sub class="text-sm ml-[-5px] mt-4 math-text">V<sub>a</sub></sub> <sup class="text-sm ml-[-15px] mb-4 math-text">V<sub>b</sub></sup> &nbsp;<span class="math-text">p</span> <span class="math-operator">d</span><span class="math-text">V</span>
                        </div>
                    </div>
                </div>

                <!-- Result Box -->
                <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl flex items-center justify-between">
                    <div>
                        <div class="text-sm text-blue-600 font-semibold mb-1">当前累计做功面积</div>
                        <div class="text-2xl font-bold text-blue-800">
                            <span class="math-text">W</span> = <span id="work-val" class="math-operator">0.00</span> 单位
                        </div>
                    </div>
                    <div id="conclusion" class="text-sm font-bold text-red-600 bg-red-100 px-3 py-2 rounded-lg border border-red-200 shadow-sm animate-pulse">
                        注意：作功与过程有关。
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script>
        // DOM Elements
        const canvas = document.getElementById('pvCanvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('progressSlider');
        const pathRadios = document.querySelectorAll('input[name="path"]');
        
        const gasVolume = document.getElementById('gas-volume');
        const piston = document.getElementById('piston');
        const pressureValEl = document.getElementById('pressure-val');
        const workValEl = document.getElementById('work-val');

        // Animation State
        let progress = 0; // 0 to 1
        let currentPath = '1';

        // Coordinates Mapping (Logical to Canvas)
        // Logical: V in [1, 5], P in [1, 5]
        const stateA = { V: 1.5, P: 4.5 };
        const stateB = { V: 4.5, P: 1.5 };
        
        // Define paths mathematically P(V)
        // Path 1 (C): Concave up (curves inwards) -> p = p_b + (p_a - p_b) * ((V_b - V)/(V_b - V_a))^2
        function P1(V) {
            const normalizedV = (stateB.V - V) / (stateB.V - stateA.V);
            return stateB.P + (stateA.P - stateB.P) * Math.pow(normalizedV, 2);
        }

        // Path 2 (D): Concave down (curves outwards) -> p = p_a - (p_a - p_b) * ((V - V_a)/(V_b - V_a))^2
        function P2(V) {
            const normalizedV = (V - stateA.V) / (stateB.V - stateA.V);
            return stateA.P - (stateA.P - stateB.P) * Math.pow(normalizedV, 2);
        }

        // Handle Canvas Resizing
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            // High DPI support
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            draw();
        }

        window.addEventListener('resize', resizeCanvas);

        // Core Drawing Function
        function draw() {
            const width = canvas.width / (window.devicePixelRatio || 1);
            const height = canvas.height / (window.devicePixelRatio || 1);
            
            // Margins
            const padL = 40;
            const padB = 40;
            const padR = 20;
            const padT = 20;

            const drawW = width - padL - padR;
            const drawH = height - padB - padT;

            // Map logical (V, P) to screen (x, y)
            // V domain: [0, 5.5], P domain: [0, 5.5]
            const maxV = 5.5;
            const maxP = 5.5;

            function getX(V) { return padL + (V / maxV) * drawW; }
            function getY(P) { return height - padB - (P / maxP) * drawH; }

            // Clear canvas
            ctx.clearRect(0, 0, width, height);

            // 1. Draw Area Under Curve (Up to current progress)
            const activeV = stateA.V + progress * (stateB.V - stateA.V);
            const activeFunc = currentPath === '1' ? P1 : P2;
            const fillColor = currentPath === '1' ? 'rgba(239, 68, 68, 0.2)' : 'rgba(20, 184, 166, 0.2)';

            if (progress > 0) {
                ctx.beginPath();
                ctx.moveTo(getX(stateA.V), getY(0));
                ctx.lineTo(getX(stateA.V), getY(activeFunc(stateA.V)));
                
                // Draw curve segment
                const steps = 50;
                for (let i = 1; i <= steps; i++) {
                    const t = i / steps;
                    const v = stateA.V + t * (activeV - stateA.V);
                    ctx.lineTo(getX(v), getY(activeFunc(v)));
                }
                
                ctx.lineTo(getX(activeV), getY(0));
                ctx.closePath();
                ctx.fillStyle = fillColor;
                ctx.fill();
            }

            // 2. Draw Axes
            ctx.beginPath();
            ctx.moveTo(padL, padT);
            ctx.lineTo(padL, height - padB);
            ctx.lineTo(width - padR, height - padB);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#1e293b';
            ctx.stroke();

            // Axis arrows
            ctx.beginPath();
            ctx.moveTo(padL - 4, padT + 8);
            ctx.lineTo(padL, padT);
            ctx.lineTo(padL + 4, padT + 8);
            ctx.moveTo(width - padR - 8, height - padB - 4);
            ctx.lineTo(width - padR, height - padB);
            ctx.lineTo(width - padR - 8, height - padB + 4);
            ctx.stroke();

            // Axis Labels
            ctx.fillStyle = '#1e293b';
            ctx.font = 'italic bold 20px "Times New Roman"';
            ctx.fillText('p', padL - 25, padT + 10);
            ctx.fillText('V', width - padR - 10, height - padB + 25);
            ctx.fillText('0', padL - 15, height - padB + 15);

            // 3. Draw Background Paths
            function drawPath(func, color) {
                ctx.beginPath();
                ctx.moveTo(getX(stateA.V), getY(stateA.P));
                for (let i = 1; i <= 50; i++) {
                    const v = stateA.V + (i / 50) * (stateB.V - stateA.V);
                    ctx.lineTo(getX(v), getY(func(v)));
                }
                ctx.lineWidth = 3;
                ctx.strokeStyle = color;
                ctx.stroke();
            }

            drawPath(P1, 'rgba(239, 68, 68, 0.3)'); // Red (C) faint
            drawPath(P2, 'rgba(20, 184, 166, 0.3)'); // Teal (D) faint

            // 4. Draw Active Path (Highlight)
            ctx.beginPath();
            ctx.moveTo(getX(stateA.V), getY(stateA.P));
            for (let i = 1; i <= 50; i++) {
                const t = i / 50;
                if (t > progress) break;
                const v = stateA.V + t * (stateB.V - stateA.V);
                ctx.lineTo(getX(v), getY(activeFunc(v)));
            }
            ctx.lineWidth = 4;
            ctx.strokeStyle = currentPath === '1' ? '#ef4444' : '#14b8a6';
            ctx.stroke();

            // 5. Draw Guide lines for State A and B
            ctx.setLineDash([5, 5]);
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#94a3b8';
            
            // State A
            ctx.beginPath();
            ctx.moveTo(getX(stateA.V), getY(stateA.P));
            ctx.lineTo(getX(stateA.V), getY(0));
            ctx.stroke();
            
            // State B
            ctx.beginPath();
            ctx.moveTo(getX(stateB.V), getY(stateB.P));
            ctx.lineTo(getX(stateB.V), getY(0));
            ctx.stroke();
            
            ctx.setLineDash([]); // Reset

            // Labels for Va, Vb
            ctx.font = 'italic 16px "Times New Roman"';
            ctx.fillStyle = '#475569';
            ctx.fillText('Va', getX(stateA.V) - 10, height - padB + 20);
            ctx.fillText('Vb', getX(stateB.V) - 10, height - padB + 20);

            // 6. Draw State Points
            function drawPoint(V, P, label, ox, oy) {
                const x = getX(V);
                const y = getY(P);
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#0f172a';
                ctx.stroke();
                
                ctx.fillStyle = '#0f172a';
                ctx.font = 'italic bold 20px "Times New Roman"';
                ctx.fillText(label, x + ox, y + oy);
            }

            drawPoint(stateA.V, stateA.P, 'a', -20, 5);
            drawPoint(stateB.V, stateB.P, 'b', 10, 5);
            
            // Current State dot
            if(progress > 0 && progress < 1) {
                ctx.beginPath();
                ctx.arc(getX(activeV), getY(activeFunc(activeV)), 4, 0, Math.PI * 2);
                ctx.fillStyle = '#0f172a';
                ctx.fill();
            }
            
            // Draw Path Labels
            ctx.fillStyle = '#ef4444';
            ctx.fillText('c', getX((stateA.V+stateB.V)/2) - 20, getY(P1((stateA.V+stateB.V)/2)) + 20);
            ctx.fillStyle = '#14b8a6';
            ctx.fillText('d', getX((stateA.V+stateB.V)/2) + 10, getY(P2((stateA.V+stateB.V)/2)) - 10);
        }

        // Update Physical Model and Math
        function updateSimulation() {
            // Volume representation in percentage (20% to 80% width)
            const minW = 20;
            const maxW = 80;
            const currentW = minW + progress * (maxW - minW);
            
            gasVolume.style.width = `${currentW}%`;
            piston.style.left = `${currentW}%`;

            // Calculate Pressure
            const activeV = stateA.V + progress * (stateB.V - stateA.V);
            const activeFunc = currentPath === '1' ? P1 : P2;
            const currentP = activeFunc(activeV);

            // Update UI
            pressureValEl.innerText = currentP.toFixed(2);
            
            // Change gas color intensity based on pressure (higher pressure = more intense color)
            // P goes from 1.5 to 4.5.
            const opacity = 0.1 + (currentP / 5) * 0.4;
            gasVolume.style.backgroundColor = `rgba(56, 189, 248, ${opacity})`;

            // Calculate Work (Integral estimation using Riemann sum for simplicity)
            let work = 0;
            const steps = 100;
            const dV = (activeV - stateA.V) / steps;
            
            for (let i = 0; i < steps; i++) {
                const v_mid = stateA.V + (i + 0.5) * dV;
                work += activeFunc(v_mid) * dV;
            }

            workValEl.innerText = work.toFixed(2);
            
            // Flash the conclusion text if switching path at > 0 progress
            const conclusion = document.getElementById('conclusion');
            conclusion.classList.remove('animate-pulse');
            void conclusion.offsetWidth; // trigger reflow
            conclusion.classList.add('animate-pulse');

            draw();
        }

        // Event Listeners
        slider.addEventListener('input', (e) => {
            progress = parseFloat(e.target.value);
            updateSimulation();
        });

        pathRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                currentPath = e.target.value;
                updateSimulation();
            });
        });

        // Initialize
        setTimeout(() => {
            resizeCanvas();
            updateSimulation();
        }, 100);

    </script>
</body>
</html>
