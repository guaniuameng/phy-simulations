<!DOCTYPE html>
<html>
<head>
    <title>水分子麦克斯韦速率分布</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: rgb(1, 15, 52);
            color: #e0f7fa;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: rgba(0, 30, 80, 0.7);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 150, 255, 0.5);
        }
        .slider-container {
            margin: 18px 0;
            display: flex;
            align-items: center;
        }
        label {
            display: inline-block;
            width: 150px;
            color: #4fc3f7;
            font-weight: bold;
        }
        .info-panel {
            margin-top: 25px;
            padding: 15px;
            background-color: rgba(0, 40, 90, 0.5);
            border-radius: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        input[type="range"] {
            width: 60%;
            background: #0a3d62;
            height: 8px;
            border-radius: 4px;
            margin: 0 15px;
        }
        input[type="range"]::-webkit-slider-thumb {
            background: #4fc3f7;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
        }
        h2 {
            color: #4fc3f7;
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            text-shadow: 0 0 10px rgba(79, 195, 247, 0.7);
        }
        .value-display {
            display: inline-block;
            width: 80px;
            text-align: center;
            font-weight: bold;
            color: #ff9800;
        }
        .chart-container {
            position: relative;
            margin: 20px 0;
            height: 400px;
            display: flex;
        }
        .chart-wrapper {
            flex: 3;
            position: relative;
        }
        .info-sidebar {
            flex: 1;
            margin-left: 20px;
            padding: 15px;
            background-color: rgba(0, 40, 90, 0.5);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .speed-info {
            margin-bottom: 20px;
        }
        .speed-info h3 {
            color: #4fc3f7;
            margin-bottom: 10px;
            font-size: 16px;
            border-bottom: 1px solid rgba(79, 195, 247, 0.3);
            padding-bottom: 5px;
        }
        .speed-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
        }
        .speed-label {
            color: #e0f7fa;
        }
        .speed-value {
            color: #ff9800;
            font-weight: bold;
        }
        .red-area-info {
            background-color: rgba(255, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
        }
        .red-area-info h3 {
            color: #ff5252;
            margin-bottom: 10px;
            font-size: 16px;
            border-bottom: 1px solid rgba(255, 82, 82, 0.3);
            padding-bottom: 5px;
        }
        .red-area-value {
            color: #ff9800;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            margin: 10px 0;
        }
        .mask-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>水分子麦克斯韦速率分布</h2>
        
        <div class="slider-container">
            <label for="tempSlider">温度 (K):</label>
            <input type="range" id="tempSlider" min="100" max="1000" value="300" step="10">
            <span id="tempValue" class="value-display">300</span>
        </div>
        
        <div class="slider-container">
            <label for="massSlider">分子质量 (g/mol):</label>
            <input type="range" id="massSlider" min="16" max="64" value="18" step="1">
            <span id="massValue" class="value-display">18</span>
        </div>
        
        <div class="chart-container">
            <div class="chart-wrapper">
                <canvas id="distributionChart"></canvas>
                <canvas id="maskCanvas" class="mask-overlay"></canvas>
            </div>
            
            <div class="info-sidebar">
                <div class="speed-info">
                    <h3>特征速率</h3>
                    <div class="speed-item">
                        <span class="speed-label">最概然速率:</span>
                        <span id="mostProbableSpeed" class="speed-value">526 m/s</span>
                    </div>
                    <div class="speed-item">
                        <span class="speed-label">平均速率:</span>
                        <span id="avgSpeed" class="speed-value">594 m/s</span>
                    </div>
                    <div class="speed-item">
                        <span class="speed-label">方均根速率:</span>
                        <span id="rmsSpeed" class="speed-value">645 m/s</span>
                    </div>
                    <div class="speed-item">
                        <span class="speed-label">辅助线位置:</span>
                        <span class="speed-value">947 m/s</span>
                    </div>
                </div>
                
                <div class="red-area-info">
                    <h3>红色区域统计</h3>
                    <div class="speed-item">
                        <span class="speed-label">面积:</span>
                        <span id="redAreaValue" class="speed-value">0.0034</span>
                    </div>
                    <div class="speed-item">
                        <span class="speed-label">占比:</span>
                        <span id="redAreaPercent" class="speed-value">0.34%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 物理常数
        const k = 1.380649e-23; // 玻尔兹曼常数 (J/K)
        const N_A = 6.02214076e23; // 阿伏伽德罗常数 (mol⁻¹)
        const THRESHOLD = 947; // 红色区域起始点
        
        // 获取DOM元素
        const tempSlider = document.getElementById('tempSlider');
        const massSlider = document.getElementById('massSlider');
        const tempValue = document.getElementById('tempValue');
        const massValue = document.getElementById('massValue');
        const mostProbableSpeed = document.getElementById('mostProbableSpeed');
        const avgSpeed = document.getElementById('avgSpeed');
        const rmsSpeed = document.getElementById('rmsSpeed');
        const redAreaValue = document.getElementById('redAreaValue');
        const redAreaPercent = document.getElementById('redAreaPercent');
        const maskCanvas = document.getElementById('maskCanvas');
        
        // 初始化图表
        const ctx = document.getElementById('distributionChart').getContext('2d');
        let chart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [
                    {
                        label: '概率密度',
                        data: [],
                        borderColor: '#4fc3f7',
                        backgroundColor: 'rgba(79, 195, 247, 0.2)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.4
                    },
                    {
                        label: `${THRESHOLD} m/s 辅助线`,
                        data: [{x: THRESHOLD, y: 0}, {x: THRESHOLD, y: 0.004}],
                        borderColor: '#ff9800',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        pointRadius: 0,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                    duration: 300,
                    easing: 'linear'
                },
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            color: '#e0f7fa',
                            font: {
                                size: 14
                            },
                            usePointStyle: true,
                            padding: 20
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return `f(${Math.round(context.parsed.x)} m/s) = ${context.parsed.y.toExponential(2)}`;
                            }
                        },
                        backgroundColor: 'rgba(0, 30, 60, 0.8)',
                        titleColor: '#4fc3f7',
                        bodyColor: '#e0f7fa'
                    }
                },
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: '速率 v (m/s)',
                            color: '#e0f7fa',
                            font: {
                                size: 16,
                                weight: 'bold'
                            }
                        },
                        type: 'linear',
                        min: 0,
                        max: 2000,
                        ticks: {
                            stepSize: 200,
                            color: '#e0f7fa',
                            font: {
                                size: 12,
                                weight: 'bold'
                            },
                            callback: function(value) {
                                return Math.round(value);
                            }
                        },
                        grid: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        },
                        border: {
                            color: '#e0f7fa',
                            width: 2
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: '概率密度 f(v)',
                            color: '#e0f7fa',
                            font: {
                                size: 16,
                                weight: 'bold'
                            }
                        },
                        min: 0,
                        max: 0.004,
                        ticks: {
                            stepSize: 0.001,
                            color: '#e0f7fa',
                            font: {
                                size: 12,
                                weight: 'bold'
                            }
                        },
                        grid: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        },
                        border: {
                            color: '#e0f7fa',
                            width: 2
                        }
                    }
                }
            }
        });
        
        // 设置遮罩层
        function setupMask() {
            maskCanvas.width = chart.width;
            maskCanvas.height = chart.height;
        }
        
        // 绘制遮罩层
        function drawMask() {
            const maskCtx = maskCanvas.getContext('2d');
            maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
            
            // 获取图表区域的位置和大小
            const chartArea = chart.chartArea;
            
            // 计算THRESHOLD在图表上的x坐标
            const xScale = chart.scales.x;
            const yScale = chart.scales.y;
            const thresholdX = xScale.getPixelForValue(THRESHOLD);
            
            // 绘制红色区域 (速率 > 947 m/s)
            maskCtx.fillStyle = 'rgba(255, 0, 0, 0.6)';
            maskCtx.beginPath();
            
            const data = chart.data.datasets[0].data;
            
            // 找到THRESHOLD对应的索引
            let thresholdIndex = 0;
            for (let i = 0; i < data.length; i++) {
                if (data[i].x >= THRESHOLD) {
                    thresholdIndex = i;
                    break;
                }
            }
            
            // 从THRESHOLD处开始绘制曲线
            for (let i = thresholdIndex; i < data.length; i++) {
                const x = xScale.getPixelForValue(data[i].x);
                const y = yScale.getPixelForValue(data[i].y);
                
                if (i === thresholdIndex) {
                    maskCtx.moveTo(x, y);
                } else {
                    maskCtx.lineTo(x, y);
                }
            }
            
            // 连接到右下角
            maskCtx.lineTo(xScale.getPixelForValue(2000), yScale.getPixelForValue(0));
            // 连接到THRESHOLD处的x轴点
            maskCtx.lineTo(thresholdX, yScale.getPixelForValue(0));
            // 闭合路径
            maskCtx.closePath();
            maskCtx.fill();
        }
        
        // 计算红色区域面积
        function calculateRedArea(data, threshold) {
            let area = 0;
            let thresholdIndex = 0;
            
            // 找到阈值对应的索引
            for (let i = 0; i < data.length; i++) {
                if (data[i].x >= threshold) {
                    thresholdIndex = i;
                    break;
                }
            }
            
            // 计算红色区域面积（使用梯形法则）
            for (let i = thresholdIndex; i < data.length - 1; i++) {
                const dx = data[i+1].x - data[i].x;
                const avgY = (data[i].y + data[i+1].y) / 2;
                area += dx * avgY;
            }
            
            return area;
        }
        
        // 计算麦克斯韦速率分布
        function calculateDistribution() {
            const T = parseFloat(tempSlider.value);
            const M = parseFloat(massSlider.value); // 摩尔质量 (g/mol)
            const m = (M / 1000) / N_A; // 单个分子质量 (kg)
            
            // 更新当前值显示
            tempValue.textContent = T;
            massValue.textContent = M;
            
            // 速率范围 (0-2000 m/s)
            const v = [];
            const dataPoints = [];
            
            for (let i = 0; i <= 2000; i += 10) {
                v.push(i);
            }
            
            // 计算分布函数
            const f = v.map(speed => {
                const coeff = 4 * Math.PI * Math.pow(m / (2 * Math.PI * k * T), 1.5);
                return coeff * speed * speed * Math.exp(-m * speed * speed / (2 * k * T));
            });
            
            // 归一化处理 (确保曲线下面积为1)
            let area = 0;
            for (let i = 0; i < v.length - 1; i++) {
                const dv = v[i+1] - v[i];
                area += dv * (f[i] + f[i+1]) / 2;
            }
            const f_normalized = f.map(val => val / area);
            
            // 准备图表数据点
            for (let i = 0; i < v.length; i++) {
                dataPoints.push({x: v[i], y: f_normalized[i]});
            }
            
            // 更新图表数据
            chart.data.datasets[0].data = dataPoints;
            
            // 禁用动画以加快更新速度
            chart.options.animation.duration = 0;
            
            // 更新图表
            chart.update();
            
            // 立即更新遮罩层
            setupMask();
            drawMask();
            
            // 重新启用动画
            chart.options.animation.duration = 300;
            
            // 更新特征速率
            const v_p = Math.sqrt(2 * k * T / m); // 最概然速率
            const v_avg = Math.sqrt(8 * k * T / (Math.PI * m)); // 平均速率
            const v_rms = Math.sqrt(3 * k * T / m); // 方均根速率
            
            mostProbableSpeed.textContent = Math.round(v_p) + ' m/s';
            avgSpeed.textContent = Math.round(v_avg) + ' m/s';
            rmsSpeed.textContent = Math.round(v_rms) + ' m/s';
            
            // 计算并更新红色区域面积
            const redArea = calculateRedArea(dataPoints, THRESHOLD);
            redAreaValue.textContent = redArea.toFixed(4);
            redAreaPercent.textContent = (redArea * 100).toFixed(2) + '%';
        }
        
        // 滑块事件监听
        let isUpdating = false;
        
        tempSlider.addEventListener('input', function() {
            tempValue.textContent = this.value;
            if (!isUpdating) {
                isUpdating = true;
                calculateDistribution();
                setTimeout(() => { isUpdating = false; }, 50);
            }
        });
        
        massSlider.addEventListener('input', function() {
            massValue.textContent = this.value;
            if (!isUpdating) {
                isUpdating = true;
                calculateDistribution();
                setTimeout(() => { isUpdating = false; }, 50);
            }
        });
        
        // 初始计算
        calculateDistribution();
        
        // 窗口大小变化时重新绘制遮罩
        window.addEventListener('resize', () => {
            setTimeout(() => {
                setupMask();
                drawMask();
            }, 100);
        });
    </script>
</body>
</html>
