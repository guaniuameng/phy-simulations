ray-50:hover{--tw-bg-opacity:1;background-color:rgb(249 250 251 / var(--tw-bg-opacity, 1))}@media (min-width: 768px){.md\:w-80{width:20rem}.md\:flex-row{flex-direction:row}}@media (min-width: 1024px){.lg\:w-\[420px\]{width:420px}}</style></head>
<body class="flex flex-col md:flex-row h-screen">

    <!-- 左侧控制与解说面板 -->
    <div class="w-full md:w-80 lg:w-[420px] bg-white shadow-xl z-10 flex flex-col h-full border-r border-gray-200 overflow-y-auto">
        <div class="p-5 border-b border-gray-100 bg-blue-50">
            <h1 class="text-xl font-bold text-gray-800 leading-tight">切向单位矢量的时间变化率</h1>
            <p class="text-sm text-gray-600 mt-2">解答：法向加速度到底是怎么推导出来的？</p>
        </div>
        
        <div class="p-5 flex-grow flex flex-col gap-6">
            <!-- 核心公式展示 -->
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 text-center">
                <div class="text-sm font-medium text-gray-500 mb-2">PPT 核心公式：</div>
                <div class="text-xl math-font text-blue-800 flex items-center justify-center gap-2">
                    <span class="text-black vector-bar math-bold">a</span><sub class="text-black -ml-1">n</sub> 
                    <span class="text-black">= v</span> 
                    <span class="inline-block align-middle mx-1">
                        <div class="border-b border-blue-800 text-center text-sm leading-none pb-1">d<span class="vector-bar">e</span><sub>t</sub></div>
                        <div class="text-center text-sm leading-none pt-1">dt</div>
                    </span>
                    <span class="text-black">=</span>
                    <span class="inline-block align-middle mx-1">
                        <div class="border-b border-blue-800 text-center text-sm leading-none pb-1">v<sup>2</sup></div>
                        <div class="text-center text-sm leading-none pt-1">ρ</div>
                    </span>
                    <span class="vector-bar text-black">e</span><sub class="text-black -ml-1">n</sub>
                </div>
            </div>

            <!-- 控制区 -->
            <div>
                <label class="flex justify-between text-sm font-semibold text-gray-700 mb-3">
                    <span>调节角度差 Δθ</span>
                    <span id="theta-display" class="text-blue-600 font-mono font-bold">0.001 rad</span>
                </label>
                <input type="range" id="theta-slider" min="0.001" max="1.5" step="0.001" value="1.0">
                
                <div class="mt-6 flex flex-col gap-3">
                    <button id="btn-limit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-md transition duration-200 flex items-center justify-center gap-2 shadow-md">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        演示 Δt → 0 的极限过程
                    </button>
                    
                    <button id="btn-download" class="w-full bg-white hover:bg-gray-50 text-gray-700 font-medium py-2 px-4 rounded-md transition duration-200 flex items-center justify-center gap-2 shadow-sm border border-gray-300 text-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        下载此演示页面
                    </button>
                </div>
            </div>

            <!-- 动态解说区 -->
            <div id="explanation-box" class="mt-2 p-5 bg-yellow-50 rounded-lg text-sm text-gray-800 leading-relaxed border border-yellow-200 shadow-inner">
                    <div class="font-bold text-green-600 mb-2 border-b border-green-200 pb-2">极限状态：Δt → 0 (微积分的核心)</div>
                    <ul class="list-none space-y-3 mt-2">
                        <li>🎯 <b>方向：</b> <span class="math-font text-red-600 font-bold">Δe<sub>t</sub></span> 的方向最终与 <span class="math-font text-green-700 font-bold">e<sub>t1</sub></span> 完全垂直，即指向法向量 <span class="math-font text-blue-600 font-bold">e<sub>n</sub></span>。</li>
                        <li>📏 <b>大小：</b> 弦长等于弧长，即 <span class="math-font">|Δe<sub>t</sub>| = 1 × Δθ = Δθ</span>。</li>
                        <li class="bg-white p-3 rounded shadow-sm border border-gray-100 mt-2">
                            <b>综合得出 PPT 上的结论：</b><br>
                            <span class="math-font text-blue-800 text-base">de<sub>t</sub> / dt = lim(Δe<sub>t</sub> / Δt) </span><br>
                            <span class="math-font text-blue-800 text-base">= (dθ/dt) e<sub>n</sub> = ω e<sub>n</sub></span><br>
                            <span class="math-font text-blue-800 text-base">= (v/ρ) e<sub>n</sub></span>
                        </li>
                    </ul>
                </div>
        </div>
    </div>

    <!-- 右侧画布区 -->
    <div class="flex-1 relative bg-[#f8fafc] flex justify-center items-center overflow-hidden" id="canvas-container">
        <!-- 分割线标签 -->
        <div class="absolute top-6 left-[25%] -translate-x-1/2 bg-white/90 px-4 py-1.5 rounded-full text-sm font-bold text-gray-700 shadow-sm border border-gray-200 backdrop-blur-sm z-10">① 空间轨迹图</div>
        <div class="absolute top-6 left-[75%] -translate-x-1/2 bg-white/90 px-4 py-1.5 rounded-full text-sm font-bold text-gray-700 shadow-sm border border-gray-200 backdrop-blur-sm z-10">② 矢量平移图 (构成等腰三角形)</div>
        
        <canvas id="sim-canvas" width="697" height="704" style="cursor: default;"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('sim-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        
        const slider = document.getElementById('theta-slider');
        const disp = document.getElementById('theta-display');
        const btnLimit = document.getElementById('btn-limit');
        const expBox = document.getElementById('explanation-box');

        let width, height;
        let dpr = window.devicePixelRatio || 1;
        let isAnimating = false;

        // --- 新增：拖拽交互逻辑 ---
        let dragTarget = null; // 'B' (左图) 或 'et2' (右图)
        let isHovering = false;
        let globalCoords = { Ox: 0, Oy: 0, Bx: 0, By: 0, Vx: 0, Vy: 0, et2x: 0, et2y: 0, lastPos: {x:0, y:0} };
        
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function checkHover(pos) {
            const distB = Math.hypot(pos.x - globalCoords.Bx, pos.y - globalCoords.By);
            const distEt2 = Math.hypot(pos.x - globalCoords.et2x, pos.y - globalCoords.et2y);
            if (distEt2 < 25) return 'et2';
            if (distB < 25) return 'B';
            return null;
        }

        function handleDragMove(pos) {
            let newTheta = parseFloat(slider.value);
            if (dragTarget === 'B') {
                let angleOB = Math.atan2(pos.y - globalCoords.Oy, pos.x - globalCoords.Ox);
                newTheta = angleOB + Math.PI / 2;
            } else if (dragTarget === 'et2') {
                newTheta = Math.atan2(pos.y - globalCoords.Vy, pos.x - globalCoords.Vx);
            }
            if (newTheta < -Math.PI) newTheta += Math.PI * 2; // 处理负角度
            newTheta = Math.max(0.001, Math.min(1.5, newTheta));
            slider.value = newTheta;
            draw();
        }

        // 鼠标事件
        canvas.addEventListener('mousedown', (e) => {
            if (isAnimating) return;
            const pos = getMousePos(e);
            dragTarget = checkHover(pos);
            if (dragTarget) canvas.style.cursor = 'grabbing';
        });

        window.addEventListener('mouseup', () => {
            dragTarget = null;
            if (!isHovering) canvas.style.cursor = 'default';
            else canvas.style.cursor = 'grab';
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isAnimating) { canvas.style.cursor = 'default'; return; }
            const pos = getMousePos(e);
            globalCoords.lastPos = pos;
            
            if (dragTarget) {
                handleDragMove(pos);
            } else {
                const hoverTarget = checkHover(pos);
                if (hoverTarget) {
                    canvas.style.cursor = 'grab';
                    if (!isHovering) { isHovering = true; draw(); }
                } else {
                    canvas.style.cursor = 'default';
                    if (isHovering) { isHovering = false; draw(); }
                }
            }
        });

        // 触摸事件
        canvas.addEventListener('touchstart', (e) => {
            if (isAnimating) return;
            const pos = getMousePos(e);
            globalCoords.lastPos = pos;
            dragTarget = checkHover(pos);
            if (dragTarget) e.preventDefault();
        }, {passive: false});
        
        window.addEventListener('touchend', () => { dragTarget = null; });
        
        canvas.addEventListener('touchmove', (e) => {
            if (isAnimating || !dragTarget) return;
            e.preventDefault();
            const pos = getMousePos(e);
            globalCoords.lastPos = pos;
            handleDragMove(pos);
        }, {passive: false});
        // --- 拖拽交互逻辑结束 ---

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            draw();
        }
        window.addEventListener('resize', resize);

        // 绘制带箭头的线
        function drawArrow(x0, y0, x1, y1, color, lineWidth=2) {
            const headlen = 10;
            const angle = Math.atan2(y1 - y0, x1 - x0);
            
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x1 - headlen * Math.cos(angle - Math.PI / 6), y1 - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x1 - headlen * Math.cos(angle + Math.PI / 6), y1 - headlen * Math.sin(angle + Math.PI / 6));
            ctx.lineTo(x1, y1);
            ctx.fillStyle = color;
            ctx.fill();
        }

        // 绘制数学文本
        function drawText(text, x, y, color, size="16px", align="center") {
            ctx.fillStyle = color;
            ctx.font = `italic ${size} "Times New Roman", serif`;
            ctx.textAlign = align;
            ctx.textBaseline = "middle";
            ctx.fillText(text, x, y);
        }

        // 新增：专门绘制带矢量箭头和下标的数学符号
        function drawMathText(base, sub, x, y, color, options = {}) {
            const size = options.size || 22; // 放大默认数学符号字号 (从 18 调到 22)
            const align = options.align || "center";
            const isVector = options.vector || false;

            ctx.fillStyle = color;
            // 测量主字符宽度
            ctx.font = `italic bold ${size}px "Times New Roman", serif`;
            const baseW = ctx.measureText(base).width;

            // 测量下标宽度
            ctx.font = `italic ${size * 0.75}px "Times New Roman", serif`;
            const subW = sub ? ctx.measureText(sub).width : 0;

            const totalW = baseW + subW;
            let startX = x;
            if (align === "center") startX = x - totalW / 2;
            else if (align === "right") startX = x - totalW;

            // 画主字符 (加粗倾斜)
            ctx.font = `italic bold ${size}px "Times New Roman", serif`;
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.fillText(base, startX, y);

            // 画下标
            if (sub) {
                ctx.font = `italic ${size * 0.75}px "Times New Roman", serif`;
                ctx.fillText(sub, startX + baseW, y + size * 0.3);
            }

            // 画上方矢量箭头
            if (isVector) {
                const arrY = y - size * 0.6;
                ctx.beginPath();
                ctx.moveTo(startX, arrY);
                ctx.lineTo(startX + baseW, arrY);
                ctx.lineTo(startX + baseW - 3, arrY - 2);
                ctx.moveTo(startX + baseW, arrY);
                ctx.lineTo(startX + baseW - 3, arrY + 2);
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        }

        // --- 新增：绘制拖拽手柄光环 ---
        function drawDragHandle(x, y, isActive) {
            ctx.beginPath();
            ctx.arc(x, y, 16, 0, Math.PI * 2);
            ctx.fillStyle = isActive ? "rgba(59, 130, 246, 0.3)" : "rgba(59, 130, 246, 0.1)";
            ctx.fill();
            ctx.strokeStyle = "rgba(59, 130, 246, 0.8)";
            ctx.lineWidth = 1.5;
            ctx.setLineDash([3, 3]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            const deltaTheta = parseFloat(slider.value);
            disp.textContent = deltaTheta.toFixed(3) + " rad";

            // --- 区域划分 ---
            const cx1 = width * 0.25; // 向左移一点，给放大留出空间
            const cy1 = height * 0.55; // 轨迹中心稍靠上一点，居中显示
            
            const cx2 = width * 0.75; // 向右移一点，给放大留出空间
            const cy2 = height * 0.5; // 矢量图中心

            const R = Math.min(width * 0.22, 340); // 显著放大轨迹曲率半径 (最大由 220 提至 340)
            const L = R * 0.9; // 相应放大单位矢量的显示长度

            // 记录坐标原点，供拖拽计算使用
            globalCoords.Ox = cx1; 
            globalCoords.Oy = cy1 + R;
            globalCoords.Vx = cx2 - L*0.5; 
            globalCoords.Vy = cy2 - L*0.5;

            // ==========================================
            // 1. 左侧：空间轨迹图
            // ==========================================
            // 圆心 O
            const Ox = cx1, Oy = cy1 + R;
            
            // 绘制虚线轨迹
            ctx.beginPath();
            ctx.arc(Ox, Oy, R, -Math.PI, 0);
            ctx.strokeStyle = "#cbd5e1";
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 8]);
            ctx.stroke();
            ctx.setLineDash([]);

            // 点 A (t 时刻)
            const Ax = Ox, Ay = Oy - R;
            ctx.beginPath();
            ctx.arc(Ax, Ay, 6, 0, Math.PI*2); // 稍微放大原点
            ctx.fillStyle = "#1e293b";
            ctx.fill();
            drawText("A (t)", Ax - 25, Ay - 20, "#1e293b", "18px"); // 放大文字，调整距离

            // 点 B (t + Δt 时刻)
            const Bx = Ox + R * Math.sin(deltaTheta);
            const By = Oy - R * Math.cos(deltaTheta);
            globalCoords.Bx = Bx; globalCoords.By = By; // 记录B点坐标

            ctx.beginPath();
            ctx.arc(Bx, By, 6, 0, Math.PI*2); // 稍微放大原点
            ctx.fillStyle = "#1e293b";
            ctx.fill();
            
            // 动态排布 B 点文字，避免与 A 点重叠
            const angleB = -Math.PI/2 + deltaTheta;
            const bTextX = Bx + Math.cos(angleB) * 20; // 增加间距
            const bTextY = By + Math.sin(angleB) * 20; // 增加间距
            drawText("B (t+Δt)", bTextX, bTextY, "#1e293b", "18px", Math.cos(angleB) >= 0 ? "left" : "right");

            // 绘制拖拽提示光环 (如果没在自动播放)
            if (!isAnimating) {
                const hoverTarget = checkHover(globalCoords.lastPos);
                drawDragHandle(Bx, By, hoverTarget === 'B' || dragTarget === 'B');
            }

            // 连接圆心与AB
            ctx.beginPath();
            ctx.moveTo(Ox, Oy); ctx.lineTo(Ax, Ay);
            ctx.moveTo(Ox, Oy); ctx.lineTo(Bx, By);
            ctx.strokeStyle = "#e2e8f0";
            ctx.lineWidth = 1;
            ctx.stroke();

            // 在圆心处绘制角度弧 Δθ
            ctx.beginPath();
            ctx.arc(Ox, Oy, R*0.3, -Math.PI/2, -Math.PI/2 + deltaTheta);
            ctx.strokeStyle = "#94a3b8";
            ctx.stroke();
            drawText("Δθ", Ox + R*0.15*Math.cos(-Math.PI/2 + deltaTheta/2), Oy + R*0.15*Math.sin(-Math.PI/2 + deltaTheta/2) - 15, "#64748b", "16px");

            // A 点的切向单位矢量 e_t1 (水平向右)
            const et1x = Ax + L, et1y = Ay;
            drawArrow(Ax, Ay, et1x, et1y, "#16a34a", 3);
            drawMathText("e", "t1", et1x + 12, et1y, "#16a34a", {vector: true, align: "left"});

            // A 点的法向矢量 e_n (竖直向下)
            drawArrow(Ax, Ay, Ax, Ay + L*0.6, "#2563eb", 2);
            drawMathText("e", "n", Ax, Ay + L*0.6 + 18, "#2563eb", {vector: true, align: "center"});

            // B 点的切向单位矢量 e_t2
            const et2DirX = Math.cos(deltaTheta);
            const et2DirY = Math.sin(deltaTheta);
            const et2x = Bx + L * et2DirX;
            const et2y = By + L * et2DirY;
            drawArrow(Bx, By, et2x, et2y, "#16a34a", 3);
            drawMathText("e", "t2", et2x + et2DirX * 12, et2y + et2DirY * 12, "#16a34a", {vector: true, align: et2DirX >= 0 ? "left" : "right"});


            // ==========================================
            // 2. 右侧：矢量平移图
            // ==========================================
            // 矢量起点公共点
            const Vx = cx2 - L*0.5;
            const Vy = cy2 - L*0.5;

            // 绘制平移后的 e_t1
            const p_et1x = Vx + L;
            const p_et1y = Vy;
            drawArrow(Vx, Vy, p_et1x, p_et1y, "#16a34a", 3);
            drawMathText("e", "t1", p_et1x + 12, p_et1y, "#16a34a", {vector: true, align: "left"});

            // 绘制平移后的 e_t2
            const p_et2x = Vx + L * et2DirX;
            const p_et2y = Vy + L * et2DirY;
            globalCoords.et2x = p_et2x; globalCoords.et2y = p_et2y; // 记录et2末端坐标

            drawArrow(Vx, Vy, p_et2x, p_et2y, "#16a34a", 3);
            drawMathText("e", "t2", p_et2x + et2DirX * 12, p_et2y + et2DirY * 12, "#16a34a", {vector: true, align: et2DirX >= 0 ? "left" : "right"});

            // 绘制拖拽提示光环
            if (!isAnimating) {
                const hoverTarget = checkHover(globalCoords.lastPos);
                drawDragHandle(p_et2x, p_et2y, hoverTarget === 'et2' || dragTarget === 'et2');
            }

            // 两者夹角 Δθ
            ctx.beginPath();
            ctx.arc(Vx, Vy, L*0.4, 0, deltaTheta);
            ctx.strokeStyle = "#94a3b8";
            ctx.stroke();
            drawText("Δθ", Vx + L*0.45*Math.cos(deltaTheta/2), Vy + L*0.45*Math.sin(deltaTheta/2), "#64748b", "16px");

            // 绘制增量矢量 Δe_t (从 e_t1 箭头指向 e_t2 箭头)
            drawArrow(p_et1x, p_et1y, p_et2x, p_et2y, "#dc2626", 4);
            
            // 计算法线以动态偏移 Δet 标签
            const midX = (p_et1x + p_et2x)/2;
            const midY = (p_et1y + p_et2y)/2;
            const dx = p_et2x - p_et1x;
            const dy = p_et2y - p_et1y;
            const len = Math.hypot(dx, dy);
            let nx = 0, ny = 0;
            if (len > 0.001) {
                // 指向三角形外部的法向量
                nx = dy / len;
                ny = -dx / len;
            }
            drawMathText("Δe", "t", midX + nx * 25, midY + ny * 25, "#dc2626", {vector: true, align: nx >= 0 ? "left" : "right"});

            // 在 e_t1 末端绘制理想的法向方向（虚线辅助线）
            ctx.beginPath();
            ctx.moveTo(p_et1x, p_et1y);
            ctx.lineTo(p_et1x, p_et1y + L*0.8);
            ctx.strokeStyle = "rgba(37, 99, 235, 0.4)";
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
            drawText("en 方向", p_et1x, p_et1y + L*0.8 + 15, "#2563eb", "14px");

            // 绘制中垂线辅助看等腰三角形
            if(deltaTheta > 0.1) {
                ctx.beginPath();
                ctx.moveTo(Vx, Vy);
                ctx.lineTo(midX, midY);
                ctx.strokeStyle = "#cbd5e1";
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // 更新左侧动态文字解释
            updateExplanation(deltaTheta);
        }

        function updateExplanation(theta) {
            let html = ``;
            if (theta > 0.8) {
                html = `
                    <div class="font-bold text-red-600 mb-2">当前状态：Δt 较大 (角度 Δθ 较大)</div>
                    <ul class="list-disc pl-4 space-y-2">
                        <li>观察右图：单位矢量 <span class="math-font text-green-700 font-bold">e<sub>t1</sub></span> 和 <span class="math-font text-green-700 font-bold">e<sub>t2</sub></span> 长度均为 1，构成一个<b>等腰三角形</b>。</li>
                        <li>增量 <span class="math-font text-red-600 font-bold">Δe<sub>t</sub></span> 是底边。此时它的方向<b>并不垂直</b>于 <span class="math-font text-green-700 font-bold">e<sub>t1</sub></span>。</li>
                        <li>根据几何关系，大小 <span class="math-font">|Δe<sub>t</sub>| = 2 sin(Δθ/2)</span>。</li>
                    </ul>
                    <div class="mt-3 text-gray-500 italic text-xs">👉 请用鼠标拖动画布中的发光锚点，或者点击下方按钮。</div>
                `;
            } else if (theta > 0.15) {
                html = `
                    <div class="font-bold text-orange-600 mb-2">当前状态：Δt 逐渐变小</div>
                    <ul class="list-disc pl-4 space-y-2">
                        <li>随着夹角 Δθ 减小，你可以看到 <span class="math-font text-red-600 font-bold">Δe<sub>t</sub></span> 的方向正在向下“偏转”。</li>
                        <li>它正在越来越逼近蓝色虚线所示的 <b>法向方向 (<span class="math-font">e<sub>n</sub></span>)</b>。</li>
                        <li>同时，等腰三角形的底边开始近似等于圆弧：<span class="math-font">sin(Δθ/2) ≈ Δθ/2</span>。</li>
                    </ul>
                `;
            } else {
                html = `
                    <div class="font-bold text-green-600 mb-2 border-b border-green-200 pb-2">极限状态：Δt → 0 (微积分的核心)</div>
                    <ul class="list-none space-y-3 mt-2">
                        <li>🎯 <b>方向：</b> <span class="math-font text-red-600 font-bold">Δe<sub>t</sub></span> 的方向最终与 <span class="math-font text-green-700 font-bold">e<sub>t1</sub></span> 完全垂直，即指向法向量 <span class="math-font text-blue-600 font-bold">e<sub>n</sub></span>。</li>
                        <li>📏 <b>大小：</b> 弦长等于弧长，即 <span class="math-font">|Δe<sub>t</sub>| = 1 × Δθ = Δθ</span>。</li>
                        <li class="bg-white p-3 rounded shadow-sm border border-gray-100 mt-2">
                            <b>综合得出 PPT 上的结论：</b><br>
                            <span class="math-font text-blue-800 text-base">de<sub>t</sub> / dt = lim(Δe<sub>t</sub> / Δt) </span><br>
                            <span class="math-font text-blue-800 text-base">= (dθ/dt) e<sub>n</sub> = ω e<sub>n</sub></span><br>
                            <span class="math-font text-blue-800 text-base">= (v/ρ) e<sub>n</sub></span>
                        </li>
                    </ul>
                `;
            }
            expBox.innerHTML = html;
        }

        // 下载文件控制
        document.getElementById('btn-download').addEventListener('click', () => {
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'normal-acceleration-derivation.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // 动画控制
        btnLimit.addEventListener('click', () => {
            if (isAnimating) return;
            isAnimating = true;
            slider.disabled = true;
            btnLimit.disabled = true;
            btnLimit.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 极限逼近中...`;

            let currentVal = parseFloat(slider.value);
            
            function step() {
                // 指数级衰减，模拟逼近 0 的过程
                currentVal *= 0.96; 
                
                if (currentVal < 0.005) {
                    currentVal = 0.001; // 避免除零并停止
                    slider.value = currentVal;
                    draw();
                    isAnimating = false;
                    slider.disabled = false;
                    btnLimit.disabled = false;
                    btnLimit.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> 重新演示`;
                    slider.value = 1.0; // 点击重新演示时重置为1.0
                    if(slider.value == 1.0) {
                        // 如果按钮文字变成了“重新演示”，点击时其实想恢复原始状态
                        // 为了避免逻辑复杂，此处简化：逼近完成后，解锁滑块，用户可自行滑动，或再次点击直接复位并重新开始。
                        btnLimit.onclick = () => {
                             slider.value = 1.0;
                             btnLimit.onclick = originalClick; // 恢复原始事件
                             originalClick(); // 立即执行
                        };
                    }
                    return;
                }
                
                slider.value = currentVal;
                draw();
                requestAnimationFrame(step);
            }

            const originalClick = () => {
                if (isAnimating) return;
                isAnimating = true;
                slider.disabled = true;
                btnLimit.disabled = true;
                btnLimit.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 极限逼近中...`;
                currentVal = 1.0;
                requestAnimationFrame(step);
            };

            requestAnimationFrame(step);
        });

        // 滑块事件
        slider.addEventListener('input', draw);

        // 初始化
        setTimeout(resize, 100);

    </script>

</body></html>
